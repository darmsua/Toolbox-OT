<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Análisis de Riesgo OT/ICS</title>
<style>
:root{
  --navy:#0f2744;--navy2:#17375e;--teal:#1f8a8a;--teal-d:#0e6b6b;--ink:#1a2535;
  --muted:#5a6b80;--line:#dfe6ee;--bg:#f4f7fa;--card:#fff;--accent:#e8743b;
  --soft:#eef4f8;--soft2:#f6f9fb;
  --r1:#e5f4e4;--r2:#d8efe9;--r3:#fde8c9;--r4:#fbdcc9;--r5:#f7c7c2;
  --r1b:#2f9e5e;--r2b:#1f8a8a;--r3b:#c88a1e;--r4b:#d9662f;--r5b:#c0392b;
}
:root[data-theme="dark"]{
  --navy:#132233;--navy2:#1b3147;--ink:#e7eef6;--muted:#9fb2c6;--line:#2b3a4c;
  --bg:#0f1720;--card:#16212e;--soft:#172431;--soft2:#1a2735;
  --r1:#1e3a2a;--r2:#1b3a39;--r3:#3d3320;--r4:#432a20;--r5:#43242a;
  --r1b:#5fcf8a;--r2b:#4fcfcf;--r3b:#e3b55a;--r4b:#f0905a;--r5b:#f06a6a;
  color-scheme:dark;
}
:root[data-theme="dark"] input.t,:root[data-theme="dark"] select.t,:root[data-theme="dark"] textarea.t{background:#1d2a38;color:var(--ink);border-color:var(--line)}
:root[data-theme="dark"] option{background:#1d2a38;color:var(--ink)}
:root[data-theme="dark"] .btn{background:#1d2a38;color:#dbe7f2}
:root[data-theme="dark"] .tag.it{background:#17324d;color:#8fc0f0}
:root[data-theme="dark"] .tag.dmz{background:#2a2550;color:#b6acf5}
:root[data-theme="dark"] .tag.ot{background:#3a2a12;color:#e8b26a}
:root[data-theme="dark"] .tag.campo{background:#163524;color:#7fd79c}
:root[data-theme="dark"] .card h2,:root[data-theme="dark"] .card h3,:root[data-theme="dark"] label.f,:root[data-theme="dark"] h1,:root[data-theme="dark"] h2,:root[data-theme="dark"] h3{color:var(--ink)}
:root[data-theme="dark"] .ptab{color:var(--muted)}
:root[data-theme="dark"] .ptab:hover{color:#fff}
:root[data-theme="dark"] .ptab.on{color:#fff;border-bottom-color:var(--accent)}
:root[data-theme="dark"] .pchip{color:var(--ink);background:#1a2735}
:root[data-theme="dark"] .pchip:hover{background:#22303f;box-shadow:none}
:root[data-theme="dark"] .pill{background:#1d2a38;color:var(--ink)}
:root[data-theme="dark"] .pill b{color:var(--ink)}
:root[data-theme="dark"] .zonewrap{background:#1a2735}
:root[data-theme="dark"] .zonewrap h4,:root[data-theme="dark"] .zone-name{color:var(--ink)}
:root[data-theme="dark"] .kpi .k{background:#1a2735}
:root[data-theme="dark"] .kpi .k .n{color:var(--ink)}
:root[data-theme="dark"] .modal{--ink:#1a2535;--muted:#5a6b80;--line:#dfe6ee;--soft:#eef4f8;--soft2:#f6f9fb;--card:#fff;--navy:#0f2744;color:#1a2535;background:#fff}
:root[data-theme="dark"] .modal input,:root[data-theme="dark"] .modal select,:root[data-theme="dark"] .modal textarea{background:#fff;color:#1a2535;border-color:#dfe6ee}
:root[data-theme="dark"] select.t option,:root[data-theme="dark"] select option{background:#1d2a38;color:#e7eef6}
:root[data-theme="dark"] .modal select option{background:#fff;color:#1a2535}
:root[data-theme="dark"] .modal .btn{background:#fff;color:#0f2744;border-color:#dfe6ee}
:root[data-theme="dark"] .modal .btn.pri{background:var(--teal);color:#fff;border-color:var(--teal)}
*{box-sizing:border-box}
html,body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:var(--ink);background:var(--bg)}
:root:not([data-theme="dark"]){color-scheme:light}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
a{color:var(--teal-d)}
.app{max-width:1180px;margin:0 auto;padding:0 18px 80px}
header.top{background:linear-gradient(135deg,var(--navy),var(--navy2) 70%,var(--teal-d));color:#fff;padding:18px 0;margin-bottom:0}
header.top .wrap{max-width:1180px;margin:0 auto;padding:0 18px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
header.top h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.3px}
header.top .sub{font-size:12.5px;color:#bcd4e6;margin-top:2px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.ribbon{background:var(--soft);border-bottom:1px solid var(--line)}
.ribtabs{display:flex;gap:2px;padding:0 14px;background:var(--navy2);max-width:1180px;margin:0 auto}
.ribtab{padding:7px 18px;color:#cfe0ee;font-size:12.5px;font-weight:700;border:0;background:transparent;border-radius:6px 6px 0 0;cursor:pointer}
.ribtab:hover{background:rgba(255,255,255,.1)}
.ribtab.on{background:var(--soft);color:var(--navy)}
.ribpage{display:flex;align-items:stretch;padding:7px 10px;max-width:1180px;margin:0 auto}
.ribpage[hidden]{display:none}
.ribpanel{display:flex;flex-direction:column;padding:0 10px;border-right:1px solid var(--line)}
.ribpanel .prow{display:flex;gap:4px;flex:1;align-items:flex-start}
.ribpanel .ptitle{font-size:9px;color:var(--muted);text-align:center;margin-top:4px;text-transform:uppercase;letter-spacing:.4px;font-weight:700}
.rbtn{width:66px;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1px solid transparent;background:transparent;border-radius:4px;color:var(--ink);font-size:10.5px;font-weight:600;padding:5px 3px;text-align:center;line-height:1.14;cursor:pointer}
.rbtn .g{font-size:18px;line-height:1}
.rbtn:hover{background:rgba(31,138,138,.14);border-color:var(--line)}
:root[data-theme="dark"] .ribtab.on{color:var(--ink)}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 8px);background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 34px rgba(15,39,68,.25);padding:6px;min-width:236px;z-index:60}
.menu-pop[hidden]{display:none}
.menu-sec{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;padding:7px 10px 3px}
.menu-item{display:block;width:100%;text-align:left;background:transparent;border:0;border-radius:7px;padding:8px 10px;font-size:13.5px;color:var(--ink);cursor:pointer;text-decoration:none}
.menu-item:hover{background:var(--soft2)}
.menu-sep{height:1px;background:var(--line);margin:5px 4px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--navy);padding:8px 14px;border-radius:8px;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--teal)}
.btn.pri{background:var(--teal);color:#fff;border-color:var(--teal)}
.btn.pri:hover{background:var(--teal-d)}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.btn.ghost:hover{background:rgba(255,255,255,.1)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.danger{color:var(--r5b);border-color:#f1c7c2}
.steps{display:flex;gap:4px;overflow-x:auto;background:var(--navy2);padding:0}
.steps .wrap{max-width:1180px;margin:0 auto;padding:0 10px;display:flex;gap:2px;width:100%}
.step{flex:1;min-width:120px;text-align:center;color:#9fb6cc;padding:11px 6px;font-size:12.5px;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.step.active{color:#fff;border-bottom-color:var(--accent)}
.step.done{color:#bfe0e0}
.step span.n{display:inline-block;width:20px;height:20px;line-height:20px;border-radius:50%;background:rgba(255,255,255,.15);font-size:11px;margin-right:6px}
.step.active span.n{background:var(--accent)}
.stickytop{position:sticky;top:0;z-index:70}
.tablewrap{overflow:auto;max-width:100%;margin-top:2px;border:1px solid var(--line);border-radius:8px}
#invTable{table-layout:fixed}
#invTable th{position:relative}
.tablewrap thead th,#invTable thead th{position:sticky;top:0;z-index:6;box-shadow:inset 0 -1px 0 var(--line)}
/* valoración: color del valor seleccionado por banda (1 MB … 5 MA) */
.vb1,select.t.vb1{background:rgba(31,122,68,.15)}
.vb2,select.t.vb2{background:rgba(120,165,55,.19)}
.vb3,select.t.vb3{background:rgba(222,170,30,.24)}
.vb4,select.t.vb4{background:rgba(226,120,40,.26)}
.vb5,select.t.vb5{background:rgba(201,63,52,.28)}
:root[data-theme="dark"] select.t.vb1{background:rgba(46,160,90,.30)}
:root[data-theme="dark"] select.t.vb2{background:rgba(150,200,70,.26)}
:root[data-theme="dark"] select.t.vb3{background:rgba(235,185,45,.26)}
:root[data-theme="dark"] select.t.vb4{background:rgba(240,140,55,.32)}
:root[data-theme="dark"] select.t.vb5{background:rgba(225,80,70,.36)}
select.t[class*="vb"]{font-weight:700;border-color:transparent}
.vbkey{display:inline-block;padding:2px 9px;border-radius:5px;font-weight:700;font-size:11px;color:var(--ink)}
th .rsz{position:absolute;top:0;right:0;width:8px;height:100%;cursor:col-resize;touch-action:none;user-select:none}
#invTable{table-layout:fixed}
#invTable td input.t,#invTable td select.t{box-sizing:border-box;min-width:0;width:100%}
#invTable td .zcell{display:flex;align-items:center;gap:4px}
#invTable td .zcell>select.t{flex:1 1 auto;width:auto;min-width:0}
.zedit{flex:0 0 auto;border:1px solid var(--line);background:var(--soft2);color:var(--teal-d);border-radius:6px;cursor:pointer;font-size:12px;line-height:1;padding:6px 7px}
.zedit:hover{background:var(--teal);color:#fff;border-color:var(--teal)}
.zedit[disabled]{opacity:.4;cursor:default}
#invTable th[data-colkey] .colgrip{display:inline-block;margin-right:4px;color:var(--muted);cursor:grab;font-size:10px;letter-spacing:-2px;vertical-align:middle}
#invTable th[data-colkey] .colgrip:active{cursor:grabbing}
#invTable th.coldrop{box-shadow:inset 3px 0 0 var(--teal)}
th .rsz:hover,#invTable.resizing th .rsz{background:var(--teal);opacity:.35}
#invTable.resizing{user-select:none}
.ptabs.collapsed{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;margin-top:20px}
.card h2{margin:0 0 4px;font-size:22px;color:var(--navy)}
.card .lead{color:var(--muted);font-size:14px;margin:0 0 18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:5px}
.field{margin-bottom:14px}
input.t,select.t,textarea.t{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
option{color:var(--ink);background:#fff}
input.t:focus,select.t:focus,textarea.t:focus{outline:none;border-color:var(--teal)}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--teal-d);background:var(--soft2)}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--teal)}
.sarr{font-size:10px;margin-left:2px}
tr:hover td{background:var(--soft2)}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.tag.it{background:#e7f1fb;color:#1a5a9e}
.tag.dmz{background:#efedff;color:#5b4bbf}
.tag.ot{background:#fff3e0;color:#9a5a12}
.tag.campo{background:#e9f7ec;color:#1f7a44}
.riskbadge{display:inline-block;min-width:26px;text-align:center;padding:3px 9px;border-radius:7px;font-weight:800;font-size:12px}
.rb1{background:var(--r1);color:var(--r1b)}.rb2{background:var(--r2);color:var(--r2b)}.rb3{background:var(--r3);color:var(--r3b)}.rb4{background:var(--r4);color:var(--r4b)}.rb5{background:var(--r5);color:var(--r5b)}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin-bottom:16px}
.palette.collapsed{display:none}
.ptabs{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--line)}
.ptab{border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);padding:8px 13px;font-weight:700;font-size:12.5px;border-radius:0;margin-bottom:-1px;cursor:pointer}
.ptab:hover{color:var(--navy)}
.ptab.on{color:var(--navy);border-bottom-color:var(--accent)}
.ptab-n{font-size:11px;opacity:.75;margin-left:3px}
.pchip{border:1px solid var(--line);border-radius:8px;padding:7px 5px 6px;background:var(--soft2);font-size:11px;font-weight:600;color:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;text-align:center;cursor:pointer;min-height:58px}
.pchip:hover{border-color:var(--teal);background:#fff;box-shadow:0 2px 10px rgba(15,39,68,.07)}
.pchip .ric{width:26px;height:26px}
.pchip .lab{font-weight:700;font-size:11px;line-height:1.15;white-space:normal}
.inv-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.inv-bar .spacer{flex:1}
.inv-filter{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px;font-size:13px}
.inv-filter select,.inv-filter input{padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:13px}
.inv-filter input{min-width:170px}
.inv-filter input::placeholder{color:var(--muted)}
.inv-filter>label{font-weight:700;color:var(--ink)}
.inv-count{color:var(--muted);font-weight:600;margin-left:auto;white-space:nowrap}
.tbl-cap{color:var(--muted);font-weight:600;font-size:12.5px;text-align:right;margin:0 2px 5px}
/* barras de scroll consistentes con el tema */
:root{scrollbar-color:var(--line) var(--bg)}
.tablewrap,.lm-grid,.colmenu-pop,.modal{scrollbar-width:thin;scrollbar-color:var(--line) var(--soft2)}
.tablewrap::-webkit-scrollbar,.lm-grid::-webkit-scrollbar,.colmenu-pop::-webkit-scrollbar,.modal::-webkit-scrollbar{width:12px;height:12px}
.tablewrap::-webkit-scrollbar-track,.lm-grid::-webkit-scrollbar-track,.colmenu-pop::-webkit-scrollbar-track,.modal::-webkit-scrollbar-track{background:var(--soft2)}
.tablewrap::-webkit-scrollbar-thumb,.lm-grid::-webkit-scrollbar-thumb,.colmenu-pop::-webkit-scrollbar-thumb,.modal::-webkit-scrollbar-thumb{background:var(--line);border-radius:7px;border:3px solid var(--soft2)}
.tablewrap::-webkit-scrollbar-thumb:hover,.lm-grid::-webkit-scrollbar-thumb:hover,.modal::-webkit-scrollbar-thumb:hover{background:var(--muted)}
.tablewrap::-webkit-scrollbar-corner,.lm-grid::-webkit-scrollbar-corner{background:var(--soft2)}
.selcol{width:34px;text-align:center;padding-left:6px;padding-right:6px}
.selcol input{cursor:pointer;margin:0;accent-color:var(--teal)}
tr.selrow td{background:rgba(31,138,138,.10)}
#invTable tbody tr:focus-within>td{background:rgba(31,138,138,.13)}
#invTable tbody tr:focus-within>td:first-child{box-shadow:inset 3px 0 0 var(--teal)}
:root[data-theme="dark"] #invTable tbody tr:focus-within>td{background:rgba(55,179,179,.17)}
.vsortpick{display:inline-flex;gap:5px;margin-left:8px;font-size:10.5px;font-weight:700;text-transform:none;letter-spacing:0;vertical-align:middle}
.vsort{cursor:pointer;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 7px;background:var(--card);user-select:none}
.vsort:hover{color:var(--teal-d);border-color:var(--teal)}
.vsort.on{color:#fff;background:var(--teal);border-color:var(--teal)}
/* modal de etiquetas */
.lblmodal .lm-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.lblmodal .lm-row>label{width:110px;font-weight:700;color:var(--navy);font-size:13px;flex-shrink:0}
.lblmodal .lm-chk{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.lblmodal .lm-off{display:flex;align-items:center;gap:4px}
.lblmodal .lm-grid{display:grid;gap:3px;margin:4px 0 10px;max-height:240px;overflow:auto;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--soft2)}
.lmcell{font-size:10px;padding:5px 0;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--muted);cursor:pointer;line-height:1}
.lmcell:hover{border-color:var(--teal);color:var(--navy)}
.lmcell.used{background:#e9edf2;color:#aab6c4;text-decoration:line-through}
.lmcell.start{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:800}
.lm-foot{display:flex;align-items:center;gap:8px;margin-top:4px}
/* hoja de etiquetas (impresión) */
#labelsheet{display:none}
.labelpage{position:relative;width:210mm;height:297mm;box-sizing:border-box;background:#fff;page:label}
.lbl{position:absolute;box-sizing:border-box;display:flex;align-items:center;gap:1mm;padding:1mm;overflow:hidden}
.lbl-qr{flex-shrink:0;display:flex;align-items:center;justify-content:center}
.lbl-qr svg{width:100%;height:100%;display:block}
.lbl-txt{min-width:0;flex:1;line-height:1.08}
.lbl-code{font-family:'Segoe UI',Arial,sans-serif;font-weight:800;font-size:3.2mm;color:#000;word-break:break-word}
.lbl-name{font-size:2.2mm;color:#111;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbl-ubic{font-size:2.1mm;color:#222;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbl-ip{font-size:2.1mm;color:#333}
@page label{size:A4;margin:0}
@media print{
  body.print-labels>*:not(#labelsheet){display:none!important}
  body.print-labels #labelsheet{display:block}
  .labelpage{page-break-after:always;break-after:page}
  .labelpage:last-child{page-break-after:auto;break-after:auto}
}
.colmenu{position:relative;display:inline-block}
.colmenu-pop{position:absolute;z-index:40;top:calc(100% + 4px);left:0;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(15,39,68,.16);padding:8px;min-width:180px}
.colmenu-pop label{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:6px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;white-space:nowrap}
.colmenu-pop label:hover{background:var(--soft2)}
.colmenu-pop input{accent-color:var(--teal)}
#invprint{display:none}
@media print{body.print-inv>*:not(#invprint){display:none !important}body.print-inv #invprint{display:block}#invprint table{width:100%;border-collapse:collapse;font-size:11px}#invprint th,#invprint td{border:1px solid #cfd8e3;padding:4px 6px;text-align:left}#invprint thead th{background:#eef4f8}}
@media print{
  body.print-inv{background:#fff}
  @page{margin:9mm}
  #invprint{width:100%;max-width:100%;color:#1a2535;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #invprint table{width:100%!important;max-width:100%!important;table-layout:fixed;border-collapse:collapse;font-size:9px}
  #invprint th,#invprint td{border:1px solid #cfd8e3;padding:3px 4px;text-align:left;vertical-align:top;overflow-wrap:anywhere;word-break:break-word}
  #invprint tr,#invprint thead,#invprint table{break-inside:avoid;page-break-inside:avoid}
  #invprint h1,#invprint h2,#invprint h3{break-after:avoid;page-break-after:avoid}
  #invprint h2{margin-top:16px !important;break-before:auto}
  #invprint h3{margin-top:11px !important}
  #invprint svg{break-inside:avoid;page-break-inside:avoid;max-width:100%!important;height:auto!important}
  #invprint .heat{break-inside:avoid;page-break-inside:avoid}
}
.ric{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;flex-shrink:0;vertical-align:middle}
.ric svg{width:100%;height:100%;display:block}
.ic-lab{display:flex;align-items:center;gap:8px;min-width:0}
.ic-lab>.lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip .z{font-size:10px;font-weight:700;opacity:.8}
.zonewrap{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;background:var(--soft2)}
.zonewrap h4{margin:0 0 8px;font-size:15px;color:var(--navy)}
.zone-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.zone-name{font-weight:700;font-size:15px;color:var(--navy);max-width:340px;flex:1;min-width:180px}
.zdrag{cursor:grab;color:var(--muted);font-size:18px;user-select:none;padding:0 4px;line-height:1}
.zonewrap.dragover{border-color:var(--teal);box-shadow:0 0 0 2px rgba(31,138,138,.2)}
.pill.dup{border-color:var(--accent)}
.dupflag{color:var(--accent);font-weight:700;font-size:11px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.zc-sticky{position:sticky;z-index:7;background:var(--card);padding:6px 0 8px;box-shadow:0 2px 0 -1px var(--line),0 6px 8px -6px rgba(15,39,68,.12)}
.scwrap{border:1px solid var(--line);border-radius:8px;margin-top:2px;overflow:visible}
.scwrap table{width:100%}
.scwrap thead th{position:sticky;z-index:6;background:var(--soft2);box-shadow:inset 0 -1px 0 var(--line)}
.legend .lrow{display:flex;gap:10px;align-items:baseline}
.legend .lrow+.lrow{margin-top:3px}
.legend .lk{flex:0 0 135px;font-weight:700;color:var(--teal-d)}
.legend .lv{flex:1 1 auto;min-width:0}
.legend-sticky{position:sticky;z-index:40;box-shadow:0 -4px 10px -6px rgba(15,39,68,.18),0 1px 0 var(--line)}
@media(max-width:560px){.legend .lrow{flex-direction:column;gap:0}.legend .lk{flex-basis:auto}}
.zc-tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:0}
.zc-tab{border:0;background:transparent;color:var(--muted);padding:8px 18px;font-weight:700;font-size:13.5px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;border-radius:6px 6px 0 0}
.zc-tab:hover{color:var(--teal-d)}
.zc-tab.on{color:var(--teal-d);border-bottom-color:var(--teal)}
.zc-tab .cnt{display:inline-block;margin-left:6px;background:var(--line);color:var(--muted);border-radius:10px;padding:0 7px;font-size:11px;font-weight:800}
.zc-tab.on .cnt{background:var(--teal);color:#fff}
.zc-body{margin-top:12px}
.pill{background:#fff;border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:12px;display:inline-flex;align-items:center;gap:6px}
.pill b{color:var(--navy)}
.pill button{border:none;background:none;color:var(--r5b);font-weight:800;font-size:14px;line-height:1;padding:0}
.val-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.val-grid .dim{text-align:center}
.val-grid .dim span{display:block;font-size:10.5px;font-weight:700;color:var(--muted);margin-bottom:3px}
.val-grid select{width:100%;padding:5px 4px;border:1px solid var(--line);border-radius:6px;text-align:center}
.footnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:12px 0;z-index:50}
.footnav .wrap{max-width:1180px;margin:0 auto;padding:0 18px;display:flex;justify-content:space-between;gap:10px}
.empty{color:var(--muted);font-size:13px;padding:18px;text-align:center;border:1px dashed var(--line);border-radius:10px;background:var(--soft2)}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.kpi .k{background:var(--soft);border-radius:10px;padding:14px;border-top:4px solid var(--teal)}
.kpi .k .n{font-size:26px;font-weight:800;color:var(--navy)}
.kpi .k .l{font-size:12px;color:var(--muted);margin-top:3px}
.heat{display:flex;flex-wrap:wrap;gap:8px}
.heat .z{border-radius:10px;padding:12px 14px;min-width:150px;color:#fff;font-weight:700}
.heat .z.zsel{outline:3px solid var(--navy);outline-offset:-3px;box-shadow:0 0 0 2px rgba(255,255,255,.65)}
:root[data-theme="dark"] .heat .z.zsel{outline-color:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.45)}
.note{background:var(--soft);border-left:4px solid var(--accent);padding:12px 16px;border-radius:0 8px 8px 0;font-size:13px;color:#34506a;margin-top:14px}
:root[data-theme="dark"] .note{color:var(--ink);background:rgba(232,116,59,.10)}
:root[data-theme="dark"] .legend{color:#c6d4e2}
.legend{margin-top:14px;font-size:12.5px;color:var(--muted);line-height:1.7;background:var(--soft2);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.legend b{color:var(--navy)}
.row-actions{text-align:center;white-space:nowrap}
.modal-bg{position:fixed;inset:0;background:rgba(15,39,68,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:18px}
.modal{background:#fff;border-radius:12px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:22px}
.modal h3{margin:0 0 12px;color:var(--navy)}
.inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
@media(max-width:820px){.grid2,.grid3,.kpi{grid-template-columns:1fr 1fr}.val-grid{grid-template-columns:repeat(4,1fr)}}
@media print{header.top,.steps,.footnav,.toolbar,.ribbon,.noprint{display:none!important}.app{padding:0}.card{break-inside:avoid}}
</style>

  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

  // QRUtil

      [6, 28, 50, 72, 94],
      [6, 26, 50, 74, 98],
      [6, 30, 54, 78, 102],
      [6, 28, 54, 80, 106],
      [6, 32, 58, 84, 110],
      [6, 30, 58, 86, 114],
      [6, 34, 62, 90, 118],

      [6, 26, 52, 78, 104, 130],
      [6, 30, 56, 82, 108, 134],

// Fichas en castellano (etiqueta · explicación llana + ejemplo OT + porqué de la dimensión) para alumnos
var TECH_INFO={
 "T0817":{es:"Compromiso al navegar",d:"El atacante infecta una web legítima; cuando alguien la visita desde un equipo de planta, se cuela el malware. Ej.: un técnico abre un portal del fabricante manipulado. Afecta a Confidencialidad porque es la vía de entrada y de acceso a información."},
 "T0822":{es:"Servicios remotos externos",d:"Entra usando accesos remotos legítimos mal protegidos (VPN, RDP, telemantenimiento). Ej.: la VPN de mantenimiento del proveedor con contraseña débil. Confidencialidad: acceso no autorizado a la red OT."},
 "T0883":{es:"Dispositivo accesible desde Internet",d:"Un PLC, HMI o SCADA queda expuesto directamente a Internet. Ej.: un SCADA accesible sin VPN desde fuera. Confidencialidad: cualquiera puede alcanzarlo."},
 "T0847":{es:"Propagación por USB",d:"El malware viaja en memorias USB hasta equipos aislados de la red. Ej.: un pendrive infectado usado en la estación de ingeniería. Integridad: puede alterar programas y datos."},
 "T0865":{es:"Phishing dirigido con adjunto",d:"Correo dirigido a un trabajador con un adjunto malicioso. Ej.: una supuesta factura al jefe de mantenimiento. Confidencialidad: entrada y robo de credenciales."},
 "T0866":{es:"Explotación de servicios remotos",d:"Aprovecha una vulnerabilidad de un servicio de red expuesto para entrar. Ej.: explotar un fallo de un protocolo de acceso remoto. Confidencialidad: compromete el acceso."},
 "T0807":{es:"Línea de comandos",d:"Ejecuta comandos en un equipo ya comprometido mediante una consola/terminal. Integridad: puede modificar el sistema y el proceso."},
 "T0823":{es:"Interfaz gráfica",d:"Opera el HMI o SCADA con ratón y teclado como si fuera un operador legítimo. Ej.: cambia consignas desde la pantalla del SCADA. Integridad: altera el control."},
 "T0834":{es:"API nativa del sistema",d:"Usa funciones internas del sistema operativo o del dispositivo para ejecutar acciones sin herramientas externas. Integridad."},
 "T0871":{es:"Ejecución vía API",d:"Abusa de una API de la aplicación (p. ej. del SCADA) para lanzar órdenes. Integridad: ejecuta acciones no previstas."},
 "T0889":{es:"Modificar el programa",d:"Cambia el programa del controlador para persistir o alterar el proceso. Ej.: inyecta lógica en el PLC S7. Integridad: el programa deja de ser de confianza."},
 "T0839":{es:"Firmware de módulo",d:"Altera el firmware de un módulo (E/S, comunicaciones) para mantenerse oculto. Integridad."},
 "T0857":{es:"Firmware del sistema",d:"Reemplaza el firmware del dispositivo para persistir incluso tras reiniciar. Integridad: el equipo queda comprometido de raíz."},
 "T0890":{es:"Escalada de privilegios",d:"Explota un fallo para obtener permisos de administrador. Confidencialidad: accede a lo que no debería."},
 "T0858":{es:"Cambiar modo de operación",d:"Pone el PLC en modo programación o remoto para manipularlo sin levantar alarmas. Integridad: habilita cambios no autorizados."},
 "T0872":{es:"Borrar rastros",d:"Elimina registros e indicadores para que no se detecte el ataque. Ej.: borra los logs del SCADA. Trazabilidad: se pierde la evidencia de lo ocurrido."},
 "T0820":{es:"Explotación para evadir",d:"Usa una vulnerabilidad para saltarse controles de seguridad o de detección. Integridad."},
 "T0840":{es:"Enumerar conexiones de red",d:"Lista qué dispositivos se comunican con cuáles para entender la red. Confidencialidad: reconocimiento."},
 "T0842":{es:"Escucha de red (sniffing)",d:"Captura el tráfico para ver protocolos, IPs y a veces credenciales. Ej.: escucha PROFINET en un switch. Confidencialidad."},
 "T0846":{es:"Descubrir sistemas remotos",d:"Busca y localiza PLCs, HMIs y servidores en la red. Confidencialidad: mapea los objetivos."},
 "T0888":{es:"Info de sistemas remotos",d:"Obtiene fabricante, modelo y firmware de los equipos para preparar el ataque. Confidencialidad."},
 "T0859":{es:"Cuentas válidas",d:"Usa credenciales legítimas robadas para moverse por la red sin ser detectado. Confidencialidad: suplanta a un usuario real."},
 "T0867":{es:"Transferir herramientas",d:"Copia sus herramientas de un equipo comprometido a otro para avanzar. Integridad."},
 "T0843":{es:"Descargar programa al PLC",d:"Carga un nuevo programa o lógica en el controlador. Ej.: sobrescribe el programa del PLC. Integridad: cambia el comportamiento del proceso."},
 "T0802":{es:"Recopilación automática",d:"Recolecta datos del proceso de forma automatizada. Confidencialidad."},
 "T0811":{es:"Datos de repositorios",d:"Extrae información del historiador o de bases de datos. Ej.: descarga históricos del Historiador. Confidencialidad."},
 "T0801":{es:"Monitorizar el proceso",d:"Observa el estado del proceso para planificar el ataque en el mejor momento. Confidencialidad."},
 "T0861":{es:"Identificar puntos y tags",d:"Descubre las variables y tags del proceso (consignas, medidas). Confidencialidad: aprende qué manipular."},
 "T0885":{es:"Puerto de uso común",d:"Camufla su comunicación en puertos habituales (80/443) para pasar desapercibido. Confidencialidad."},
 "T0869":{es:"Protocolo estándar",d:"Usa protocolos normales (HTTP, DNS) para comunicarse con el exterior sin levantar sospechas. Confidencialidad."},
 "T0878":{es:"Supresión de alarmas",d:"Desactiva u oculta alarmas para que el operador no reaccione. Ej.: silencia la alarma de sobrepresión. Safety: oculta condiciones peligrosas para las personas."},
 "T0803":{es:"Bloqueo de mensajes de orden",d:"Impide que las órdenes lleguen al PLC. Ej.: pulsas Parar en el SCADA y no ocurre nada. Disponibilidad: el proceso deja de responder."},
 "T0804":{es:"Bloqueo de mensajes de reporte",d:"Corta la información que el campo envía al SCADA; el operador se queda a ciegas. Disponibilidad."},
 "T0809":{es:"Destrucción de datos",d:"Borra datos o configuración necesarios para operar. Disponibilidad."},
 "T0814":{es:"Denegación de servicio",d:"Satura un dispositivo para dejarlo inoperativo. Ej.: inunda el PLC y deja de controlar. Disponibilidad."},
 "T0816":{es:"Reinicio/apagado de dispositivo",d:"Fuerza el reinicio o apagado de un equipo de control. Disponibilidad: el equipo deja de estar operativo."},
 "T0835":{es:"Manipular imagen de E/S",d:"Altera los valores de entradas/salidas en la memoria del PLC. Integridad: el proceso actúa sobre datos falsos."},
 "T0806":{es:"Fuerza bruta de E/S",d:"Fuerza entradas y salidas repetidamente para alterar el proceso. Integridad."},
 "T0836":{es:"Modificar parámetros",d:"Cambia consignas o parámetros de control. Ej.: sube la frecuencia del variador o una temperatura límite. Integridad."},
 "T0856":{es:"Falsear mensajes de reporte",d:"Envía datos falsos al SCADA para engañar al operador. Ej.: muestra temperatura normal mientras sube de verdad. Integridad."},
 "T0855":{es:"Orden no autorizada",d:"Envía comandos de control no legítimos a un actuador. Ej.: abre una válvula sin permiso. Safety: puede provocar un evento peligroso."},
 "T0826":{es:"Pérdida de disponibilidad",d:"El proceso o el sistema deja de estar disponible. Disponibilidad: es el impacto final."},
 "T0827":{es:"Pérdida de control",d:"El operador pierde la capacidad de controlar el proceso. Integridad."},
 "T0828":{es:"Pérdida de productividad e ingresos",d:"Parada o merma de producción con impacto económico. Disponibilidad."},
 "T0837":{es:"Pérdida de protección",d:"Se anulan funciones de seguridad o protección. Safety: el proceso queda sin salvaguardas."},
 "T0880":{es:"Pérdida de seguridad (Safety)",d:"Se compromete la seguridad física de las personas. Safety: el peor impacto posible en OT."},

function heatRGB(b){return ({1:[46,160,67],2:[74,141,181],3:[230,160,30],4:[232,116,59],5:[192,57,43]})[b]||[120,130,140];}
// Colores de las bandas de valoración MAGERIT (vb1..vb5) mezclados sobre blanco, para el informe.
function vbRGB(b){return ({1:[221,235,227],2:[229,238,217],3:[247,235,201],4:[247,220,199],5:[240,201,198]})[b]||null;}
function vbHex(b){var c=vbRGB(b);return c?('#'+c.map(function(n){return ('0'+Math.round(n).toString(16)).slice(-2);}).join('')):'';}
function resolveCSSVars(str){var cs=getComputedStyle(document.documentElement);return str.replace(/var\((--[\w-]+)\)/g,function(m,v){var val=cs.getPropertyValue(v).trim();return val||m;});}
function rasterizeSVG(svgString){return new Promise(function(res){try{var svg=resolveCSSVars(svgString);if(svg.indexOf('xmlns=')<0)svg=svg.replace('<svg','<svg xmlns="http://www.w3.org/2000/svg"');if(!/<svg[^>]*\swidth=/.test(svg))svg=svg.replace('<svg','<svg width="1000" height="560"');var img=new Image();img.onload=function(){try{var sc=2,c=document.createElement('canvas');c.width=1000*sc;c.height=560*sc;var ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.92));}catch(e){res(null);}};img.onerror=function(){res(null);};img.src='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(svg)));}catch(e){res(null);}});}
function pdfTable(doc,cols,rows,x,y,cw,bands){
  var ML=12,PH=297;
  var lens=cols.map(function(c,ci){var mx=(''+c).length;rows.forEach(function(r){mx=Math.max(mx,(''+(r[ci]==null?'':r[ci])).length);});return Math.max(3,Math.min(40,mx));});
  var tot=lens.reduce(function(a,b){return a+b;},0)||1;var widths=lens.map(function(l){return cw*l/tot;});
  doc.setFontSize(7.4);
  function row(cells,head,yy,brow){
    var lines=cells.map(function(t,ci){return doc.splitTextToSize(pdfSafe(t),widths[ci]-2);});
    var rh=Math.max.apply(null,lines.map(function(l){return l.length;}))*3.1+2.4;
    if(yy+rh>PH-ML){doc.addPage();yy=ML;}
    var cx=x;
    cells.forEach(function(t,ci){
      var bd=brow&&brow[ci];
      if(head){doc.setFillColor(238,244,248);doc.rect(cx,yy,widths[ci],rh,'F');}
      else if(bd){var vc=vbRGB(bd);if(vc){doc.setFillColor(vc[0],vc[1],vc[2]);doc.rect(cx,yy,widths[ci],rh,'F');}}
      doc.setDrawColor(207,216,227);doc.setLineWidth(0.1);doc.rect(cx,yy,widths[ci],rh);
      doc.setTextColor(26,37,53);doc.setFont('helvetica',(head||bd)?'bold':'normal');
      doc.text(lines[ci],cx+1,yy+3.3);cx+=widths[ci];
    });
    return yy+rh;
  }
  y=row(cols,true,y,null);rows.forEach(function(r,ri){y=row(r,false,y,bands&&bands[ri]);});
  return y+2.5;
}
// Sanea texto para la fuente estándar de jsPDF (sin glifos fuera de Latin-1)
function pdfSafe(s){return (''+(s==null?'':s)).replace(/[▲▸▾]/g,'').replace(/△/g,'').replace(/→/g,'a').replace(/—/g,'-').replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/…/g,'...');}
function estTableH(doc,cols,rows,cw){
  var lens=cols.map(function(c,ci){var mx=(''+c).length;rows.forEach(function(r){mx=Math.max(mx,(''+(r[ci]==null?'':r[ci])).length);});return Math.max(3,Math.min(40,mx));});
  var tot=lens.reduce(function(a,b){return a+b;},0)||1;var widths=lens.map(function(l){return cw*l/tot;});
  doc.setFontSize(7.4);
  function rh(cells){var lines=cells.map(function(t,ci){return doc.splitTextToSize(pdfSafe(t),widths[ci]-2);});return Math.max.apply(null,lines.map(function(l){return l.length;}))*3.1+2.4;}
  var h=rh(cols);rows.forEach(function(r){h+=rh(r);});return h+2.5;
}
function estHeatH(){var cw=56,gap=4,per=Math.max(1,Math.floor(186/(cw+gap)));return (Math.ceil((S.zonas.length||1)/per))*(15+gap)+4;}
function pdfHeat(doc,x,y){
  var cw=56,ch=15,gap=4,PH=297,ML=12,maxX=x+186,cx=x;
  S.zonas.forEach(function(z){
    if(cx+cw>maxX){cx=x;y+=ch+gap;}
    if(y+ch>PH-ML){doc.addPage();y=ML;cx=x;}
    var bnd=zoneRisk(z.id)||1,col=heatRGB(bnd);
    doc.setFillColor(col[0],col[1],col[2]);doc.roundedRect(cx,y,cw,ch,2,2,'F');
    doc.setTextColor(255,255,255);doc.setFontSize(8);doc.setFont('helvetica','bold');doc.text(pdfSafe(z.nombre).slice(0,24),cx+3,y+6);
    doc.setFontSize(6.5);doc.setFont('helvetica','normal');doc.text('SL-T '+(z.slt||1)+' · '+RISK_NAME[bnd],cx+3,y+11);

  return y+ch+4;
}
function downloadReportPDF(idxs,fname){
  if(!(window.jspdf&&window.jspdf.jsPDF)){toast&&toast('PDF directo no disponible; abriendo impresión…');var h='';idxs.forEach(function(i){var s=stepSections(i);if(!s)return;h+='<h2>'+esc(s.title)+'</h2>';s.sections.forEach(function(sec){if(sec.name)h+='<h3>'+esc(sec.name)+'</h3>';h+=(sec.visual?(sec.html||''):htmlTable(sec.cols,sec.rows,sec.bands));});});printReport(h,fname);return;}
  var steps=idxs.map(function(i){return stepSections(i);}).filter(Boolean);
  var tasks=[],cache={};
  steps.forEach(function(s){s.sections.forEach(function(sec){if(sec.visual&&sec.vkind==='diagram'){var m=(sec.html||'').match(/<svg[\s\S]*<\/svg>/);if(m)tasks.push(rasterizeSVG(m[0]).then(function(u){cache[sec.name]=u;}));}});});
  Promise.all(tasks).then(function(){
    var J=window.jspdf.jsPDF,doc=new J({unit:'mm',format:'a4'});
    var x=12,y=15,PW=210,PH=297,cw=186,p=S.proyecto||{};
    doc.setFont('helvetica','bold');doc.setFontSize(15);doc.setTextColor(15,39,68);doc.text('Informe de Análisis de Riesgo OT/ICS',x,y);y+=6;
    doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(90,107,128);
    doc.text(doc.splitTextToSize(pdfSafe((p.nombre||'')+(p.instalacion?' · '+p.instalacion:'')+(p.autor?' · '+p.autor:'')+' · '+(p.fecha||'')),cw),x,y);y+=7;
    var TOP=15,BOT=12,usable=PH-TOP-BOT;
    steps.forEach(function(s,si){
      if(si>0)y+=6; // separación entre apartados
      if(y>PH-34){doc.addPage();y=TOP;}
      doc.setFont('helvetica','bold');doc.setFontSize(12.5);doc.setTextColor(15,39,68);doc.text(pdfSafe(s.title),x,y);doc.setFont('helvetica','normal');y+=1.5;doc.setDrawColor(223,230,238);doc.setLineWidth(0.3);doc.line(x,y,x+cw,y);y+=5.5;
      s.sections.forEach(function(sec,sj){
        if(sj>0)y+=3; // separación entre sub-apartados
        // altura estimada del bloque (nombre + contenido) para evitar tablas partidas y títulos huérfanos
        var nameH=sec.name?5.5:0,contentH=0;
        if(sec.visual&&sec.vkind==='diagram')contentH=cw*560/1000+4;
        else if(sec.visual&&sec.vkind==='heat')contentH=estHeatH();
        else if(sec.cols&&sec.cols.length)contentH=estTableH(doc,sec.cols,sec.rows,cw);
        var blockH=nameH+contentH;
        // si no cabe aquí pero cabría en una página nueva, salta de página (bloque entero junto)
        if(y+blockH>PH-BOT && blockH<=usable){doc.addPage();y=TOP;}
        else if(y+nameH+10>PH-BOT){doc.addPage();y=TOP;} // al menos el título con el inicio del contenido
        if(sec.name){doc.setFont('helvetica','bold');doc.setFontSize(9.5);doc.setTextColor(42,56,80);doc.text(pdfSafe(sec.name),x,y);doc.setFont('helvetica','normal');y+=nameH;}
        if(sec.visual&&sec.vkind==='diagram'){var u=cache[sec.name];if(u){var w=cw,h=cw*560/1000;if(y+h>PH-BOT){doc.addPage();y=TOP;}try{doc.addImage(u,'JPEG',x,y,w,h);}catch(e){}y+=h+4;}}
        else if(sec.visual&&sec.vkind==='heat'){y=pdfHeat(doc,x,y);}
        else if(sec.cols&&sec.cols.length){y=pdfTable(doc,sec.cols,sec.rows,x,y,cw,sec.bands);}
      });
    });
    var n=doc.getNumberOfPages();for(var i=1;i<=n;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(140,153,170);doc.text('Toolbox-OT v1.9 · Análisis de Riesgo OT/ICS · pág. '+i+'/'+n,x,PH-6);}
    doc.save((fname||'Informe_Riesgo')+'.pdf');
  });
}

function initColResize(){
 var t=document.getElementById('invTable'); if(!t)return;
 var cols=t.querySelectorAll('colgroup col');
 var ths=t.querySelectorAll('thead th');
 ths.forEach(function(th,i){
   if(i>=ths.length-1)return; // última columna (acciones) sin manija
   var ckey=th.classList.contains('selcol')?'__sel':(th.getAttribute('data-colkey')||(th.getAttribute('data-sort')==='nombre'?'nombre':null));
   var h=document.createElement('span'); h.className='rsz';
   h.onclick=function(e){e.stopPropagation();}; // no ordenar al soltar
   h.addEventListener('pointerdown',function(e){
     e.preventDefault(); e.stopPropagation();
     var startX=e.clientX, startW=th.getBoundingClientRect().width;
     t.classList.add('resizing');
     try{h.setPointerCapture(e.pointerId);}catch(_){}
     function mv(ev){var w=Math.max(54,startW+(ev.clientX-startX)); if(cols[i])cols[i].style.width=w+'px';}
     function up(){document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);t.classList.remove('resizing');
       // recalcula min-width total para el scroll
       var sum=0;cols.forEach(function(c){sum+=parseFloat(c.style.width)||c.getBoundingClientRect().width;});t.style.minWidth=Math.round(sum)+'px';
       // persiste el ancho ajustado para que no se pierda al re-renderizar
       if(ckey&&cols[i]){invColW[ckey]=Math.round(parseFloat(cols[i].style.width)||th.getBoundingClientRect().width);saveInvColW();}}
     document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up);
   });
   th.appendChild(h);
 });
}

function valToBand(v){ // v numeric 0-10 or qualitative index; returns 1..5
  if(S.proyecto.config.escala==="numerica"){ v=+v||0; if(v<=2)return 1;if(v<=4)return 2;if(v<=6)return 3;if(v<=8)return 4;return 5; }
  var i=SCALE_QUAL.indexOf(v); return i<0?1:i+1;
}
function dimRaw(a,dim){ return a.val&&a.val[dim]!=null?a.val[dim]:(S.proyecto.config.escala==="numerica"?0:"MB"); }
// impacto efectivo propagado por dependencias (dependents suben su impacto al activo del que dependen)
function effectiveBand(a,dim,seen){
  seen=seen||{};
  if(seen[a.id])return valToBand(dimRaw(a,dim));
  seen[a.id]=1;
  var band=valToBand(dimRaw(a,dim));
  S.activos.forEach(function(x){
    if((x.dependeDe||[]).indexOf(a.id)>=0){ band=Math.max(band,effectiveBand(x,dim,seen)); }
  });
  return band;
}
function probBand(p){ var i=PROB_QUAL.indexOf(p); return i<0?1:i+1; }
function scenarioRisk(sc){
  var a=S.activos.find(function(x){return x.id===sc.activo;});
  if(!a)return {band:1,imp:1,prob:probBand(sc.prob)};
  var imp=effectiveBand(a,sc.dim);
  var pr=probBand(sc.prob);
  var band=MATRIX[imp][pr-1];
  // regla de aversión safety/medioambiente
  var c=S.proyecto.config;
  if(c.aversion && (sc.dim==="S"||sc.dim==="E") && imp>=c.umbral){ band=Math.max(band,c.aversionFloor||4); }
  return {band:band,imp:imp,prob:pr};
}
function zoneRisk(zid){
  var mx=0;
  S.escenarios.forEach(function(sc){
    var a=S.activos.find(function(x){return x.id===sc.activo;});
    if(a&&(a.zonas||[]).indexOf(zid)>=0){ mx=Math.max(mx,scenarioRisk(sc).band); }
  });
  return mx;
}
function zoneInfo(a){
  var zs=(a.zonas||[]).map(function(zid){var z=S.zonas.find(function(x){return x.id===zid;});return z?z.nombre+" (SL-T "+(z.slt||1)+")":null;}).filter(Boolean);
  return zs.length?zs.join(" · "):"sin zona";
}
// --- filtro de la tabla de Valoración (nombre / tipo / zona / dimensiones MAGERIT) ---
var valFilterField="", valFilterText="";
function valFieldText(a,field){
  if(field==="nombre")return a.nombre||"";
  if(field==="tipo")return (DT_BY_ID[a.type]||{label:a.type}).label||"";
  if(field==="zona")return zoneInfo(a);
  if(field.indexOf("dim:")===0)return ""+dimRaw(a,field.slice(4));
  return "";
}
function valRowMatch(a){
  var q=(valFilterText||"").trim().toLowerCase();
  if(!q)return true;
  var terms=q.split(",").map(function(s){return s.trim();}).filter(Boolean);
  if(!terms.length)return true;
  var fields=valFilterField?[valFilterField]:["nombre","tipo","zona"].concat(DIMS.map(function(d){return "dim:"+d.k;}));
  var hay=fields.map(function(f){return valFieldText(a,f).toLowerCase();}).join(" ␟ ");
  return terms.some(function(t){return hay.indexOf(t)>=0;});
}
function valFilterLabel(){return valFilterField?(valFilterField==="nombre"?"Nombre":valFilterField==="tipo"?"Tipo":valFilterField==="zona"?"Zona":valFilterField.indexOf("dim:")===0?("Dim. "+valFilterField.slice(4)):valFilterField):"cualquier campo";}

/* ---- Paso 4: Zonas y conductos ---- */
/* ---- Paso 4: diagrama de zonas y conductos (SVG) ---- */
var diagLayout=lsGet("ot_risk_diaglayout","purdue");
var diagView={s:1,tx:0,ty:0}; // zoom/pan del diagrama (en memoria de sesión)
var DIAG_W=1000, DIAG_H=560;
function sltCol(s){return ({1:"#1f7a44",2:"#4a8db5",3:"#e8743b",4:"#c0392b"})[s]||"#5a6b80";}
function diagClip(s,n){s=s||"";return s.length>n?s.slice(0,n-1)+"…":s;}
function diagNodeSize(z){return {w:Math.max(96,Math.min(224,(z.nombre||"Zona").length*8+54)),h:48};}
function zoneAvgLevel(z){var m=S.activos.filter(function(a){return (a.zonas||[]).indexOf(z.id)>=0;});var s=0,n=0;m.forEach(function(a){if(typeof a.purdue==="number"){s+=a.purdue;n++;}});return n?s/n:null;}
function autoLayoutZones(mode){
  var zs=S.zonas; if(!zs.length)return;
  var pad=80;
  if(mode==="circulo"){
    var cx=DIAG_W/2, cy=DIAG_H/2, R=Math.min(DIAG_W,DIAG_H)/2-95;
    zs.forEach(function(z,i){var ang=-Math.PI/2+i*2*Math.PI/zs.length;var sz=diagNodeSize(z);z.gx=Math.round(cx+R*Math.cos(ang)-sz.w/2);z.gy=Math.round(cy+R*Math.sin(ang)-sz.h/2);});
  } else {
    // Y por nivel Purdue (4 arriba → 0 abajo); X repartido para no apilar en una columna
    var maxL=4, top=60, bot=DIAG_H-72;
    var arr=zs.map(function(z){return {z:z,l:zoneAvgLevel(z)};});
    arr.sort(function(a,b){var la=(a.l==null?-1:a.l),lb=(b.l==null?-1:b.l);return lb-la;});
    var n=arr.length;
    arr.forEach(function(o,i){
      var z=o.z,sz=diagNodeSize(z);
      var lv=(o.l==null)?null:Math.max(0,Math.min(maxL,o.l));
      var y=(lv==null)?bot:(top+(maxL-lv)/maxL*(bot-top));
      var x=pad+(DIAG_W-2*pad)*((i+0.5)/n);
      z.gx=Math.round(x-sz.w/2);z.gy=Math.round(y-sz.h/2);
    });
  }
}
function ensureZonePos(){if(S.zonas.some(function(z){return typeof z.gx!=="number"||typeof z.gy!=="number";}))autoLayoutZones(diagLayout);}
function borderPt(node,tx,ty){var cx=node.x+node.w/2,cy=node.y+node.h/2,dx=tx-cx,dy=ty-cy;if(!dx&&!dy)return {x:cx,y:cy};var hw=node.w/2,hh=node.h/2,s=Math.min(hw/Math.abs(dx||1e-6),hh/Math.abs(dy||1e-6));return {x:cx+dx*s,y:cy+dy*s};}
// Geometría de un conducto i de un grupo de n paralelos: línea desplazada en
// perpendicular + etiqueta escalonada a lo largo del conducto (para que no se solapen).
function bezierPoint(p1,ctrl,p2,t){var mt=1-t;return {x:mt*mt*p1.x+2*mt*t*ctrl.x+t*t*p2.x,y:mt*mt*p1.y+2*mt*t*ctrl.y+t*t*p2.y};}
function nearestT(p1,ctrl,p2,x,y){var best=0.5,bd=Infinity;for(var t=0.06;t<=0.94;t+=0.02){var b=bezierPoint(p1,ctrl,p2,t);var dd=(b.x-x)*(b.x-x)+(b.y-y)*(b.y-y);if(dd<bd){bd=dd;best=t;}}return best;}
function edgeGeom(A,B,i,n,ltOverride,bowOverride){
  var acx=A.x+A.w/2,acy=A.y+A.h/2,bcx=B.x+B.w/2,bcy=B.y+B.h/2;
  var dx=bcx-acx,dy=bcy-acy,len=Math.sqrt(dx*dx+dy*dy)||1,px=-dy/len,py=dx/len;
  var p1=borderPt(A,bcx,bcy),p2=borderPt(B,acx,acy);
  var autoBow=(n<=1)?0:(i-(n-1)/2)*Math.min(34,Math.max(20,len*0.12)); // flecha automática, crece con la longitud
  var off=(bowOverride!=null)?bowOverride:2*autoBow; // distancia perpendicular del punto de control (editable arrastrando el conducto)
  var mx0=(p1.x+p2.x)/2,my0=(p1.y+p2.y)/2;
  var cX=mx0+px*off,cY=my0+py*off,ctrl={x:cX,y:cY};
  var d="M"+p1.x.toFixed(1)+","+p1.y.toFixed(1)+" Q"+cX.toFixed(1)+","+cY.toFixed(1)+" "+p2.x.toFixed(1)+","+p2.y.toFixed(1);
  var t=(ltOverride!=null)?ltOverride:((n<=1)?0.5:Math.max(0.28,Math.min(0.72,0.5+(i-(n-1)/2)*(0.46/n))));
  var lp=bezierPoint(p1,ctrl,p2,t);
  return {d:d,mx:lp.x,my:lp.y,p1:p1,p2:p2,ctrl:ctrl};
}
function diagEdge(c,pos,i,n){
  var g=edgeGeom(pos[c.origen],pos[c.destino],i,n,c.lt,c.bow);
  var col=sltCol(c.slt),lbl=(c.protocolos||"—")+" · SL-T "+(c.slt||"?"),lw=lbl.length*6.0+14;
  return '<g class="dedge" data-cid="'+(c.id||"")+'" data-o="'+c.origen+'" data-d="'+c.destino+'" data-ci="'+i+'" data-cn="'+n+'">'+
    '<path class="ehit" d="'+g.d+'" fill="none" stroke="#000" stroke-opacity="0" stroke-width="16" style="cursor:row-resize;pointer-events:stroke"><title>Arrastra el conducto para curvarlo (doble clic lo restablece)</title></path>'+
    '<path class="emain" d="'+g.d+'" fill="none" stroke="'+col+'" stroke-width="2.4" stroke-opacity="0.85" style="pointer-events:none"/>'+
    '<g class="elabel" style="cursor:move"><title>Arrastra para deslizar la etiqueta por el conducto</title>'+
      '<rect x="'+(g.mx-lw/2).toFixed(1)+'" y="'+(g.my-9).toFixed(1)+'" width="'+lw.toFixed(1)+'" height="18" rx="5" fill="#ffffff" stroke="'+col+'" stroke-width="1.2" fill-opacity="0.96"/>'+
      '<text x="'+g.mx.toFixed(1)+'" y="'+(g.my+4).toFixed(1)+'" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" fill="#1a2535">'+esc(lbl)+'</text>'+
    '</g>'+
  '</g>';
}
function diagNode(z,p){
  var col=sltCol(z.slt),m=S.activos.filter(function(a){return (a.zonas||[]).indexOf(z.id)>=0;}).length;
  return '<g class="dnode" data-zid="'+z.id+'" transform="translate('+p.x+','+p.y+')" style="cursor:grab">'+
    '<rect width="'+p.w+'" height="'+p.h+'" rx="11" fill="'+col+'" fill-opacity="0.16" stroke="'+col+'" stroke-width="2.2"/>'+
    '<rect width="7" height="'+p.h+'" rx="3" fill="'+col+'"/>'+
    '<text x="15" y="'+(p.h/2-2)+'" font-family="Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#1a2535">'+esc(diagClip(z.nombre,22))+'</text>'+
    '<text x="15" y="'+(p.h/2+14)+'" font-family="Segoe UI,Arial,sans-serif" font-size="10.5" fill="#5a6b80">'+m+' activo'+(m===1?"":"s")+'</text>'+
    '<g transform="translate('+(p.w-30)+',9)"><rect width="22" height="18" rx="5" fill="'+col+'"/><text x="11" y="13" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffffff">'+(z.slt||"?")+'</text></g>'+
  '</g>';
}
function diagramSVG(){
  if(!S.zonas.length)return '<div class="empty">No hay zonas todavía. Crea zonas en la pestaña «Zonas» para ver el diagrama.</div>';
  ensureZonePos();
  var pos={}; S.zonas.forEach(function(z){var sz=diagNodeSize(z);pos[z.id]={x:z.gx,y:z.gy,w:sz.w,h:sz.h};});
  var groups={};
  S.conductos.forEach(function(c){if(!pos[c.origen]||!pos[c.destino])return;var k=c.origen<c.destino?c.origen+"|"+c.destino:c.destino+"|"+c.origen;(groups[k]=groups[k]||[]).push(c);});
  var edges=""; Object.keys(groups).forEach(function(k){var arr=groups[k];arr.forEach(function(c,i){edges+=diagEdge(c,pos,i,arr.length);});});
  var nodes=S.zonas.map(function(z){return diagNode(z,pos[z.id]);}).join("");
  var orphan=S.activos.filter(function(a){return !(a.zonas&&a.zonas.length);}).length;
  var cap=orphan?'<text x="14" y="'+(DIAG_H-14)+'" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#b8501f">⚠ '+orphan+' activo(s) sin zona</text>':'';
  if(S.viewDiagram){diagView.s=S.viewDiagram.s||1;diagView.tx=S.viewDiagram.tx||0;diagView.ty=S.viewDiagram.ty||0;} // zoom/pan persistido por proyecto
  var vpT="translate("+diagView.tx.toFixed(2)+","+diagView.ty.toFixed(2)+") scale("+diagView.s.toFixed(4)+")";
  return '<svg id="zcDiagram" viewBox="0 0 '+DIAG_W+' '+DIAG_H+'" style="width:100%;height:auto;max-height:72vh;touch-action:none;user-select:none;background:#f6f9fb;border:1px solid var(--line);border-radius:10px">'+
    '<rect id="diagBg" width="'+DIAG_W+'" height="'+DIAG_H+'" fill="#f6f9fb" style="cursor:grab"/>'+
    '<g id="diagVP" transform="'+vpT+'"><g id="diagEdges">'+edges+'</g><g id="diagNodes">'+nodes+'</g></g>'+cap+
  '</svg>';
}
function bindDiagram(){
  var svg=main.querySelector("#zcDiagram"); if(!svg)return;
  var vp=svg.querySelector("#diagVP");
  var sel=el("diagLayoutSel"); if(sel)sel.onchange=function(){diagLayout=sel.value;lsSet("ot_risk_diaglayout",diagLayout);autoLayoutZones(diagLayout);save();render();};
  var re=el("diagReorg"); if(re)re.onclick=function(){autoLayoutZones(diagLayout);save();render();};
  var ex=el("diagExport"); if(ex)ex.onclick=exportDiagramPNG;
  // --- zoom / desplazamiento (pan), consistente con Red OT ---
  function applyView(){if(vp)vp.setAttribute("transform","translate("+diagView.tx.toFixed(2)+","+diagView.ty.toFixed(2)+") scale("+diagView.s.toFixed(4)+")");}
  function saveView(){S.viewDiagram={s:diagView.s,tx:diagView.tx,ty:diagView.ty};save();}
  function rootPt(cx,cy){var pt=svg.createSVGPoint();pt.x=cx;pt.y=cy;var m=svg.getScreenCTM();if(!m)return{x:cx,y:cy};var r=pt.matrixTransform(m.inverse());return{x:r.x,y:r.y};}
  function zoomAt(rx,ry,ns){ns=Math.max(0.4,Math.min(3.2,ns));var px=(rx-diagView.tx)/diagView.s,py=(ry-diagView.ty)/diagView.s;diagView.tx=rx-px*ns;diagView.ty=ry-py*ns;diagView.s=ns;applyView();saveView();}
  svg.addEventListener("wheel",function(e){e.preventDefault();var p=rootPt(e.clientX,e.clientY);zoomAt(p.x,p.y,diagView.s*(e.deltaY<0?1.12:1/1.12));},{passive:false});
  var zin=el("diagZoomIn");if(zin)zin.onclick=function(){zoomAt(DIAG_W/2,DIAG_H/2,diagView.s*1.2);};
  var zout=el("diagZoomOut");if(zout)zout.onclick=function(){zoomAt(DIAG_W/2,DIAG_H/2,diagView.s/1.2);};
  var zres=el("diagZoomReset");if(zres)zres.onclick=function(){diagView={s:1,tx:0,ty:0};applyView();saveView();};
  svg.addEventListener("pointerdown",function(e){
    if(e.target!==svg&&e.target.id!=="diagBg")return;e.preventDefault();
    var start=rootPt(e.clientX,e.clientY),t0={x:diagView.tx,y:diagView.ty},bg=svg.querySelector("#diagBg");
    try{svg.setPointerCapture(e.pointerId);}catch(_){}if(bg)bg.style.cursor="grabbing";
    function mv(ev){var c=rootPt(ev.clientX,ev.clientY);diagView.tx=t0.x+(c.x-start.x);diagView.ty=t0.y+(c.y-start.y);applyView();}
    function up(){svg.removeEventListener("pointermove",mv);svg.removeEventListener("pointerup",up);if(bg)bg.style.cursor="grab";saveView();}
    svg.addEventListener("pointermove",mv);svg.addEventListener("pointerup",up);
  });
  applyView();
  var pos={}; S.zonas.forEach(function(z){var sz=diagNodeSize(z);pos[z.id]={x:z.gx,y:z.gy,w:sz.w,h:sz.h};});
  // coords de diagrama (compensa zoom/pan): CTM del grupo viewport
  function toSvg(cx,cy){var pt=svg.createSVGPoint();pt.x=cx;pt.y=cy;var m=(vp||svg).getScreenCTM();if(!m)return{x:cx,y:cy};var r=pt.matrixTransform(m.inverse());return{x:r.x,y:r.y};}
  function updateEdges(){svg.querySelectorAll(".dedge").forEach(function(g){
    var A=pos[g.getAttribute("data-o")],B=pos[g.getAttribute("data-d")],i=+g.getAttribute("data-ci"),n=+g.getAttribute("data-cn");if(!A||!B)return;
    var cObj=S.conductos.find(function(x){return x.id===g.getAttribute("data-cid");});
    var e=edgeGeom(A,B,i,n,cObj?cObj.lt:null,cObj?cObj.bow:null);
    g.querySelectorAll("path").forEach(function(pp){pp.setAttribute("d",e.d);});
    var rc=g.querySelector(".elabel rect"),tx=g.querySelector(".elabel text"),lw=parseFloat(rc.getAttribute("width"));
    rc.setAttribute("x",(e.mx-lw/2).toFixed(1));rc.setAttribute("y",(e.my-9).toFixed(1));tx.setAttribute("x",e.mx.toFixed(1));tx.setAttribute("y",(e.my+4).toFixed(1));
  });}
  svg.querySelectorAll(".dnode").forEach(function(g){g.addEventListener("pointerdown",function(e){
    e.preventDefault();e.stopPropagation();var zid=g.getAttribute("data-zid"),start=toSvg(e.clientX,e.clientY),p0={x:pos[zid].x,y:pos[zid].y};
    g.style.cursor="grabbing";try{g.setPointerCapture(e.pointerId);}catch(_){}
    function mv(ev){var cur=toSvg(ev.clientX,ev.clientY);var nx=Math.max(0,Math.min(DIAG_W-pos[zid].w,p0.x+(cur.x-start.x))),ny=Math.max(0,Math.min(DIAG_H-pos[zid].h,p0.y+(cur.y-start.y)));pos[zid].x=nx;pos[zid].y=ny;g.setAttribute("transform","translate("+nx.toFixed(1)+","+ny.toFixed(1)+")");updateEdges();}
    function up(){g.removeEventListener("pointermove",mv);g.removeEventListener("pointerup",up);g.style.cursor="grab";var z=S.zonas.find(function(x){return x.id===zid;});if(z){z.gx=Math.round(pos[zid].x);z.gy=Math.round(pos[zid].y);}save();}
    g.addEventListener("pointermove",mv);g.addEventListener("pointerup",up);
  });});
  // arrastrar el propio conducto para ajustar la amplitud del arco a voluntad
  svg.querySelectorAll(".dedge").forEach(function(g){
    var hit=g.querySelector(".ehit"); if(!hit)return;
