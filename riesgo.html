.row-actions{display:flex;gap:6px;justify-content:flex-end}
.modal-bg{position:fixed;inset:0;background:rgba(15,39,68,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:18px}
.modal{background:#fff;border-radius:12px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:22px}

.inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}

function initColResize(){
 var t=document.getElementById('invTable'); if(!t)return;
 var cols=t.querySelectorAll('colgroup col');
 var ths=t.querySelectorAll('thead th');
 ths.forEach(function(th,i){
   if(i>=ths.length-1)return; // última columna (acciones) sin manija
   var h=document.createElement('span'); h.className='rsz';
   h.onclick=function(e){e.stopPropagation();}; // no ordenar al soltar
   h.addEventListener('pointerdown',function(e){
     e.preventDefault(); e.stopPropagation();
     var startX=e.clientX, startW=th.getBoundingClientRect().width;
     t.classList.add('resizing');
     try{h.setPointerCapture(e.pointerId);}catch(_){}
     function mv(ev){var w=Math.max(54,startW+(ev.clientX-startX)); if(cols[i])cols[i].style.width=w+'px';}
     function up(){document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);t.classList.remove('resizing');
       // recalcula min-width total para el scroll
       var sum=0;cols.forEach(function(c){sum+=parseFloat(c.style.width)||c.getBoundingClientRect().width;});t.style.minWidth=Math.round(sum)+'px';}
     document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up);
   });
   th.appendChild(h);
 });
}

/* ============================ MOTOR ============================ */
function valToBand(v){ // v numeric 0-10 or qualitative index; returns 1..5
  if(S.proyecto.config.escala==="numerica"){ v=+v||0; if(v<=2)return 1;if(v<=4)return 2;if(v<=6)return 3;if(v<=8)return 4;return 5; }
  var i=SCALE_QUAL.indexOf(v); return i<0?1:i+1;
}
function dimRaw(a,dim){ return a.val&&a.val[dim]!=null?a.val[dim]:(S.proyecto.config.escala==="numerica"?0:"MB"); }
// impacto efectivo propagado por dependencias (dependents suben su impacto al activo del que dependen)
function effectiveBand(a,dim,seen){
  seen=seen||{};
  if(seen[a.id])return valToBand(dimRaw(a,dim));
  seen[a.id]=1;
  var band=valToBand(dimRaw(a,dim));
  S.activos.forEach(function(x){
    if((x.dependeDe||[]).indexOf(a.id)>=0){ band=Math.max(band,effectiveBand(x,dim,seen)); }
  });
  return band;
}
function probBand(p){ var i=PROB_QUAL.indexOf(p); return i<0?1:i+1; }
function scenarioRisk(sc){
  var a=S.activos.find(function(x){return x.id===sc.activo;});
  if(!a)return {band:1,imp:1,prob:probBand(sc.prob)};
  var imp=effectiveBand(a,sc.dim);
  var pr=probBand(sc.prob);
  var band=MATRIX[imp][pr-1];
  // regla de aversión safety/medioambiente
  var c=S.proyecto.config;
  if(c.aversion && (sc.dim==="S"||sc.dim==="E") && imp>=c.umbral){ band=Math.max(band,c.aversionFloor||4); }
  return {band:band,imp:imp,prob:pr};
}
function zoneRisk(zid){
  var mx=0;
  S.escenarios.forEach(function(sc){
    var a=S.activos.find(function(x){return x.id===sc.activo;});
    if(a&&(a.zonas||[]).indexOf(zid)>=0){ mx=Math.max(mx,scenarioRisk(sc).band); }
  });
  return mx;
}
function zoneInfo(a){
  var zs=(a.zonas||[]).map(function(zid){var z=S.zonas.find(function(x){return x.id===zid;});return z?z.nombre+" (SL-T "+(z.slt||1)+")":null;}).filter(Boolean);
  return zs.length?zs.join(" · "):"sin zona";
}

   '<div class="inline noprint" style="margin-bottom:12px"><input class="t" id="newzone" placeholder="Nombre de la zona (p. ej. Control célula 1)" style="max-width:320px"><button class="btn pri sm" id="addzone">+ Zona</button>'+

/* ---- Paso 5: Amenazas ---- */
function stAmenazas(){
  if(!S.activos.length)return '<div class="card"><h2>Amenazas</h2><div class="empty">Añade activos antes de asociar amenazas.</div></div>';
  var tacOpts=ATTACK.map(function(g){return '<optgroup label="'+esc(g.tac)+'">'+g.ts.map(function(t){return '<option value="'+t.id+'">'+t.id+' · '+esc(t.n)+'</option>';}).join("")+'</optgroup>';}).join("");
  var aOpts=S.activos.map(function(a){return '<option value="'+a.id+'">'+esc(a.nombre)+' — '+esc(zoneInfo(a))+'</option>';}).join("");
  var rows=S.escenarios.length?S.escenarios.map(function(sc){
    var a=S.activos.find(function(x){return x.id===sc.activo;})||{nombre:"?"};
    var t=TECH_BY_ID[sc.amenaza]||{n:"?",tac:""};
    return '<tr><td>'+esc(a.nombre)+'<div class="muted" style="font-size:11px">'+esc(zoneInfo(a))+'</div></td><td><b>'+esc(sc.amenaza)+'</b> '+esc(t.n)+'<div class="muted" style="font-size:11px">'+esc(t.tac)+'</div></td>'+
      '<td><select class="t" style="width:auto" data-sc="'+sc.id+'" data-sf="dim">'+DIMS.map(function(d){return '<option value="'+d.k+'"'+(sc.dim===d.k?" selected":"")+'>'+d.k+'</option>';}).join("")+'</select>'+((sc.dim==="S"||sc.dim==="E")&&a.id?'<div class="muted" style="font-size:10.5px;margin-top:2px">impacto '+sc.dim+': <b>'+IPLABEL[effectiveBand(a,sc.dim)]+'</b></div>':'')+'</td>'+
      '<td><select class="t" style="width:auto" data-sc="'+sc.id+'" data-sf="prob">'+PROB_QUAL.map(function(p){return '<option'+(sc.prob===p?" selected":"")+'>'+p+'</option>';}).join("")+'</select></td>'+
      '<td><input class="t" data-sc="'+sc.id+'" data-sf="nota" value="'+esc(sc.nota||"")+'" placeholder="Anotación…" style="min-width:170px"></td>'+
      '<td class="row-actions"><button class="btn sm danger" data-del-sc="'+sc.id+'">✕</button></td></tr>';
  }).join(""):'';
  return '<div class="card"><h2>Amenazas (ATT&amp;CK for ICS)</h2>'+
   '<p class="lead">Asocia técnicas a tus activos y estima su probabilidad. Catálogo inicial docente (revisar/ampliar).</p>'+
   '<div class="noprint" style="margin-bottom:10px"><button class="btn sm" id="atthelp">ℹ️ Guía: MITRE ATT&amp;CK for ICS</button></div>'+
   '<div class="inline noprint" style="margin-bottom:12px">Activo <select class="t sm" id="scA" style="width:auto">'+aOpts+'</select> Técnica <select class="t sm" id="scT" style="min-width:260px">'+tacOpts+'</select><button class="btn pri sm" id="addsc">+ Escenario</button></div>'+
   (S.escenarios.length?('<table><thead><tr><th>Activo</th><th>Técnica</th><th>Dim.</th><th>Prob.</th><th>Nota</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>'):'<div class="empty">Sin escenarios. Añade el primero arriba.</div>')+
   '<div class="legend"><div><b>Dim.</b> — dimensión que la amenaza compromete: D Disponibilidad · I Integridad · C Confidencialidad · A Autenticidad · T Trazabilidad · S Safety · E Medioambiente.</div><div><b>Prob.</b> — probabilidad de que la amenaza se materialice: MB Muy baja · B Baja · M Media · A Alta · MA Muy alta.</div></div>'+
  '</div>';
}

/* ---- Paso 6: Riesgo y SL ---- */
function stRiesgo(){
  if(!S.escenarios.length)return '<div class="card"><h2>Riesgo y SL</h2><div class="empty">Define escenarios de amenaza primero.</div></div>';
  var rows=S.escenarios.map(function(sc){
    var a=S.activos.find(function(x){return x.id===sc.activo;})||{nombre:"?"};
    var t=TECH_BY_ID[sc.amenaza]||{n:""};
    var r=scenarioRisk(sc);
    var cfg=S.proyecto.config, isSE=(sc.dim==="S"||sc.dim==="E");
    var av=(cfg.aversion&&isSE&&r.imp>=cfg.umbral);
    var avMiss=(cfg.aversion&&isSE&&r.imp<cfg.umbral);
    return {sc:sc,a:a,t:t,r:r,av:av,avMiss:avMiss};
  }).sort(function(x,y){return y.r.band-x.r.band;});
  var body=rows.map(function(o){
    var dimN=o.sc.dim==="S"?"Safety":"Medioambiente";
    var mark=o.av?' <span title="Regla de aversión aplicada: el riesgo se elevó a '+RISK_NAME[S.proyecto.config.aversionFloor||4]+'" style="color:var(--accent);font-weight:700">▲</span>'
      :(o.avMiss?' <span title="Regla de aversión NO aplicada: impacto en '+dimN+' = '+IPLABEL[o.r.imp]+', por debajo del gatillo ('+RISK_NAME[S.proyecto.config.umbral]+' o superior). Valora '+dimN+' del activo en el Paso 3 para activarla." style="color:var(--accent);cursor:help;font-weight:700">△</span>':'');
    return '<tr><td>'+esc(o.a.nombre)+'</td><td>'+esc(o.sc.amenaza)+' '+esc(o.t.n)+'</td>'+
     '<td style="text-align:center">'+o.sc.dim+'</td>'+
     '<td style="text-align:center"><span class="riskbadge rb'+o.r.imp+'">'+IPLABEL[o.r.imp]+'</span></td>'+
     '<td style="text-align:center"><span class="riskbadge rb'+o.r.prob+'">'+IPLABEL[o.r.prob]+'</span></td>'+
     '<td style="text-align:center"><span class="riskbadge rb'+o.r.band+'">'+RISK_NAME[o.r.band]+'</span>'+mark+'</td></tr>';
  }).join("");
  return '<div class="card"><h2>Riesgo calculado</h2>'+
   '<p class="lead">Impacto (propagado por dependencias) × probabilidad, con la regla de aversión marcada con ▲.</p>'+
   '<table><thead><tr><th>Activo</th><th>Amenaza</th><th>Dim.</th><th>Impacto</th><th>Prob.</th><th>Riesgo</th></tr></thead><tbody>'+body+'</tbody></table>'+
   '<div class="legend"><div><b>Dim.</b> — dimensión comprometida: D Disponibilidad · I Integridad · C Confidencialidad · A Autenticidad · T Trazabilidad · S Safety · E Medioambiente.</div><div><b>Impacto</b> y <b>Prob.</b> — bandas: MB Muy bajo/a · B Bajo/a · M Medio/a · A Alto/a · MA Muy alto/a.</div><div><b>Riesgo</b> = Impacto × Prob. (matriz 5×5): MB · B · M · A · C Crítico. <b style="color:var(--accent)">▲</b> = aversión aplicada (riesgo elevado). <b style="color:var(--accent)">△</b> = escenario Safety/M.Amb. pero impacto por debajo del gatillo: la regla no aplica (pasa el ratón para ver por qué).</div></div>'+
  '</div>';
}

/* ---- Paso 7: Resultados ---- */
function stResultados(){
  var escen=S.escenarios.map(function(sc){var r=scenarioRisk(sc);return {sc:sc,r:r};});
  var crit=escen.filter(function(o){return o.r.band>=4;}).length;
  var maxb=escen.reduce(function(m,o){return Math.max(m,o.r.band);},0);
  var kpi='<div class="kpi">'+
    '<div class="k"><div class="n">'+S.activos.length+'</div><div class="l">activos</div></div>'+
    '<div class="k"><div class="n">'+S.zonas.length+'</div><div class="l">zonas</div></div>'+
    '<div class="k"><div class="n">'+S.escenarios.length+'</div><div class="l">escenarios</div></div>'+
    '<div class="k" style="border-top-color:var(--accent)"><div class="n">'+crit+'</div><div class="l">riesgo alto/crítico</div></div>'+
  '</div>';
  // mapa de calor por zona
  var heat=S.zonas.length?('<div class="heat">'+S.zonas.map(function(z){
    var b=zoneRisk(z.id)||1;var bg=getComputedStyle(document.documentElement).getPropertyValue("--r"+b);
    return '<div class="z" style="background:var(--r'+b+'b)">'+esc(z.nombre)+'<div style="font-weight:600;font-size:12px;opacity:.95">SL-T '+(z.slt||1)+' · riesgo '+RISK_NAME[b]+'</div></div>';
  }).join("")+'</div>'):'<div class="empty">Define zonas para ver el mapa de calor.</div>';
  // registro priorizado
  var reg=escen.sort(function(a,b){return b.r.band-a.r.band;}).map(function(o){
    var a=S.activos.find(function(x){return x.id===o.sc.activo;})||{nombre:"?"};
    var t=TECH_BY_ID[o.sc.amenaza]||{n:""};
    return '<tr><td style="text-align:center"><span class="riskbadge rb'+o.r.band+'">'+RISK_NAME[o.r.band]+'</span></td><td>'+esc(a.nombre)+'</td><td>'+esc(o.sc.amenaza)+' '+esc(t.n)+'</td><td style="text-align:center">'+o.sc.dim+'</td><td class="muted" style="font-size:12px">'+esc(o.sc.nota||"")+'</td></tr>';
  }).join("");
  return '<div class="card"><h2>Resultados</h2>'+
   '<p class="lead">Resumen de la evaluación, mapa de calor por zona y registro de riesgos priorizado.</p>'+
   kpi+
   '<h3 style="color:var(--navy);font-size:16px;margin:6px 0 10px">Mapa de calor por zona</h3>'+heat+
   '<h3 style="color:var(--navy);font-size:16px;margin:20px 0 10px">Registro de riesgos priorizado</h3>'+
   (S.escenarios.length?('<table><thead><tr><th>Riesgo</th><th>Activo</th><th>Amenaza</th><th>Dim.</th><th>Nota</th></tr></thead><tbody>'+reg+'</tbody></table>'):'<div class="empty">Sin escenarios evaluados.</div>')+
   '<div class="note noprint">Exporta el proyecto a JSON (para entregar) o genera el informe PDF desde la barra superior.</div>'+
  '</div>';
}

  main.querySelectorAll("[data-add]").forEach(function(c){c.onclick=function(){

      var n=S.activos.filter(function(a){return a.type===dt.id;}).length+1;

  var dragFrom=null;

  var ac=el("addcond");if(ac)ac.onclick=function(){var o=el("condO").value,d=el("condD").value;if(!o||!d||o===d)return;update(function(){S.conductos.push({id:nid("c"),origen:o,destino:d,protocolos:"",slt:2});});};

function download(name,text){var b=new Blob([text],{type:"application/json"});var u=URL.createObjectURL(b);var a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(u);},500);}
function slug(s){return (s||"proyecto").toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"");}

function importRedOT(obj){
  // tolerante: busca un array de dispositivos con type/props/zone
  var devs=null;
  if(Array.isArray(obj))devs=obj;
  else devs=obj.devices||obj.activos||obj.nodes||(obj.state&&obj.state.devices)||null;
  if(!devs||!devs.length){alert("No encontré dispositivos en ese JSON de Red OT.");return;}
  var nz=0,nc=0;
  update(function(){
    // El nombre del proyecto pasa a ser el importado
    if(obj.nombre&&typeof obj.nombre==="string"&&obj.nombre.trim())S.proyecto.nombre=obj.nombre.trim();
    var idmap={};
    devs.forEach(function(d){
      var type=d.type||d.tipo||"server";
      var props=d.props||d;
      var dt=DT_BY_ID[type]||DT_BY_ID.server;
      var zcat=(props.zone||dt.zone||"IT");
      var lvl=(d.level!=null&&!isNaN(parseFloat(d.level)))?parseFloat(d.level):(TYPE_BAND[dt.id]!=null?TYPE_BAND[dt.id]:(ZONE_PURDUE[zcat]!=null?ZONE_PURDUE[zcat]:2));
      var aid=nid("a");
      if(d.id!=null)idmap[d.id]=aid;
      S.activos.push({id:aid,type:dt.id,nombre:props.name||props.nombre||dt.label,
        purdue:lvl,zonaCat:zcat,
        ip:props.ip||"",val:{},dependeDe:[],zonas:[],
        meta:{vlan:props.vlan||"",mfr:props.manufacturer||dt.mfr||"",model:props.model||"",product_code:props.product_code||"",firmware:props.firmware||"",notes:props.notes||""}});
    });
    // Zonas dibujadas en el editor → zonas IEC 62443, con sus activos asignados
    var zmap={};
    (obj.zonas||[]).forEach(function(z){
      var zid=nid("z");zmap[z.id]=zid;nz++;
      S.zonas.push({id:zid,nombre:z.nombre||"Zona",slt:(z.slt>=1&&z.slt<=4)?z.slt:2});
      (z.devices||[]).forEach(function(did){var aid=idmap[did];if(!aid)return;var a=S.activos.find(function(x){return x.id===aid;});if(a){a.zonas=a.zonas||[];if(a.zonas.indexOf(zid)<0)a.zonas.push(zid);}});
    });
    // Conductos: conexiones del editor que cruzan de una zona a otra
    if(nz){
      var seen={};
      (obj.conexiones||obj.conns||[]).forEach(function(c){
        var af=S.activos.find(function(x){return x.id===idmap[c.from];}),at=S.activos.find(function(x){return x.id===idmap[c.to];});
        if(!af||!at)return;
        var zf=(af.zonas||[])[0],zt=(at.zonas||[])[0];
        if(!zf||!zt||zf===zt)return;
        var key=zf<zt?zf+"|"+zt:zt+"|"+zf;if(seen[key])return;seen[key]=true;nc++;
        S.conductos.push({id:nid("c"),origen:zf,destino:zt,protocolos:c.protocolos||c.proto||"",slt:2});
      });
    }
    S._step=0;
  });
  showModal("✓ Importación desde Red OT completada",
   '<p style="font-size:14px">Se ha importado el esquema <b>'+esc(S.proyecto.nombre)+'</b>.</p>'+
   '<ul style="font-size:14px;line-height:1.7;margin:8px 0 14px">'+
   '<li><b>'+devs.length+'</b> activos añadidos al inventario</li>'+
   '<li><b>'+nz+'</b> zona(s) IEC 62443'+(nz?' con sus activos asignados':'')+'</li>'+
   '<li><b>'+nc+'</b> conducto(s) derivados de las conexiones entre zonas</li>'+
   '</ul>'+
   '<p class="hint">Revisa los datos del proyecto en el <b>paso 1</b> y continúa con la valoración (paso 3).</p>');
}

function confirmModal(msg,cb){
  var bg=document.createElement("div");bg.className="modal-bg";
  bg.innerHTML='<div class="modal" style="max-width:420px"><p style="font-size:14px;margin:4px 0 16px">'+esc(msg)+'</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn sm" data-close>Cancelar</button><button class="btn pri sm" data-ok>Sí, continuar</button></div></div>';
  bg.addEventListener("click",function(e){if(e.target===bg||e.target.hasAttribute("data-close"))document.body.removeChild(bg);else if(e.target.hasAttribute("data-ok")){document.body.removeChild(bg);cb();}});
  document.body.appendChild(bg);
}
function promptModal(title,def,cb){
  var bg=document.createElement("div");bg.className="modal-bg";
  bg.innerHTML='<div class="modal" style="max-width:400px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px"><h3 style="margin:0">'+esc(title)+'</h3><button class="btn sm" data-close>Cerrar</button></div><input class="t pm" value="'+esc(def)+'" style="margin-bottom:14px"><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn sm" data-close>Cancelar</button><button class="btn pri sm" data-ok>Crear</button></div></div>';
  var inp=bg.querySelector(".pm");
  function done(){var v=inp.value.trim();if(document.body.contains(bg))document.body.removeChild(bg);if(v)cb(v);}
  bg.addEventListener("click",function(e){if(e.target===bg||e.target.hasAttribute("data-close"))document.body.removeChild(bg);else if(e.target.hasAttribute("data-ok"))done();});
  bg.addEventListener("keydown",function(e){if(e.key==="Enter")done();if(e.key==="Escape"&&document.body.contains(bg))document.body.removeChild(bg);});
  document.body.appendChild(bg);setTimeout(function(){inp.focus();inp.select();},30);
}
function showModal(title,inner){
  var bg=document.createElement("div");bg.className="modal-bg";
  bg.innerHTML='<div class="modal"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px"><h3 style="margin:0">'+title+'</h3><button class="btn sm" data-close>Cerrar</button></div>'+inner+'</div>';
  bg.addEventListener("click",function(e){if(e.target===bg||e.target.hasAttribute("data-close"))document.body.removeChild(bg);});
  document.body.appendChild(bg);
}

var THEME_KEY="ot_risk_theme";
function loadTheme(){try{return localStorage.getItem(THEME_KEY)||"light";}catch(e){return "light";}}
function applyTheme(t){
  if(t==="dark")document.documentElement.setAttribute("data-theme","dark");
  else document.documentElement.removeAttribute("data-theme");
  var ic=document.getElementById("themeIcon"),lb=document.getElementById("themeLbl");
  if(ic)ic.textContent=(t==="dark")?"☀":"🌙";
  if(lb)lb.textContent=(t==="dark")?"Tema claro":"Tema oscuro";
  var b=document.getElementById("btnTheme");
  if(b&&!ic)b.textContent=(t==="dark")?"☀ Claro":"🌙 Oscuro";
}
function toggleTheme(){var cur=loadTheme();var nx=cur==="dark"?"light":"dark";try{localStorage.setItem(THEME_KEY,nx);}catch(e){}applyTheme(nx);}
function helpCentral(){
  showModal("Guía completa de la aplicación",
   '<p style="font-size:14px">Esta herramienta evalúa el <b>riesgo en sistemas OT/ICS</b> combinando tres marcos: <b>IEC 62443-3-2</b> (proceso: zonas y conductos), <b>MAGERIT v3</b> (valoración de activos) y <b>MITRE ATT&CK for ICS</b> (amenazas). El trabajo se organiza en 7 pasos.</p>'+
   '<h4>Los 7 pasos</h4>'+
   '<ol style="font-size:13.5px;line-height:1.6">'+
   '<li><b>Proyecto</b> — datos de la instalación y configuración del cálculo (escala y regla de aversión).</li>'+
   '<li><b>Inventario</b> — añade activos desde la paleta (la misma de «Red OT»), por categorías. El catálogo se puede <b>ocultar</b> para ganar espacio. El listado permite <b>elegir qué columnas mostrar</b> (🗂️ Columnas: tipo, Purdue, categoría, zona IEC, IP, fabricante, modelo, VLAN, firmware), <b>redimensionarlas</b> arrastrando el borde de la cabecera y <b>ordenarlas</b> al hacer clic en ella. Botones <b>⤓ CSV</b> y <b>⤓ PDF</b> para exportar el inventario con los datos del proyecto.</li>'+
   '<li><b>Valoración</b> — puntúa cada activo en 7 dimensiones MAGERIT: D·I·C·A·T + Safety + Medioambiente.</li>'+
   '<li><b>Zonas y conductos</b> — agrupa activos en zonas (IEC 62443) con su <b>SL-T</b> y define los conductos entre ellas.</li>'+
   '<li><b>Amenazas</b> — crea escenarios con técnicas <b>ATT&CK for ICS</b>, indicando la dimensión afectada y la probabilidad.</li>'+
   '<li><b>Riesgo y SL</b> — riesgo por escenario (impacto × probabilidad) y agregado por zona.</li>'+
   '<li><b>Resultados</b> — resumen, mapa de calor por zona y registro de riesgos; exporta a JSON o PDF.</li>'+
   '</ol>'+
   '<h4>Escala y regla de aversión</h4>'+
   '<p style="font-size:13.5px;line-height:1.6">La valoración puede ser <b>cualitativa</b> (MB–MA) o <b>numérica</b> (0–10). La <b>regla de aversión</b> eleva el riesgo cuando están implicadas Safety (S) o Medioambiente (E), reflejando que un impacto en seguridad de las personas no es negociable. <b>Importante:</b> la regla se dispara según el <b>impacto</b> del activo en S o E (lo que valoras en el Paso 3), no por el mero hecho de que el escenario elija esa dimensión. En el Paso 6, <b style="color:var(--accent)">▲</b> marca los escenarios donde la regla elevó el riesgo y <b style="color:var(--accent)">△</b> los escenarios Safety/M.Amb. cuyo impacto quedó por debajo del gatillo (la regla no aplica; pasa el ratón para ver por qué).</p>'+
   '<h4>SL-T (IEC 62443)</h4>'+
   '<p style="font-size:13.5px;line-height:1.6"><b>SL-T</b> (Security Level Target, 1–4) es el nivel de seguridad objetivo de cada zona/conducto según el atacante del que debe protegerse (de SL 1, error accidental, a SL 4, atacante con amplios recursos). El objetivo del proceso es alcanzar <b>SL-A ≥ SL-T</b>.</p>'+
   '<h4>MAGERIT — dimensiones</h4>'+
   '<p style="font-size:13.5px;line-height:1.6"><b>D</b> Disponibilidad · <b>I</b> Integridad · <b>C</b> Confidencialidad · <b>A</b> Autenticidad · <b>T</b> Trazabilidad · <b>S</b> Safety (seguridad física) · <b>E</b> Medioambiente. En OT, D y S suelen pesar más que C.</p>'+
   '<h4>Integración con «Red OT»</h4>'+
   '<p style="font-size:13.5px;line-height:1.6">Diseña la arquitectura en el editor <b>Red OT</b>, dibuja las zonas (con SL-T) y exporta el JSON. Aquí usa <b>Archivo → Importar Red OT</b>: se crean automáticamente los activos, las zonas y los conductos. El nombre del proyecto se toma del esquema importado.</p>'+
   '<h4>Guardado, importación y tema</h4>'+
   '<p style="font-size:13.5px;line-height:1.6">El trabajo se guarda en el navegador automáticamente. <b>Exportar JSON</b> genera un archivo para entregar o continuar en otro equipo; <b>Importar</b> lo recupera. <b>Informe PDF</b> prepara una versión imprimible. El botón <b>Tema</b> alterna claro/oscuro.</p>'+
   '<p class="hint">Prototipo educativo; no sustituye un análisis de riesgos profesional conforme a IEC 62443.</p>');
}

function bindTop(){
  var bt=el("btnTheme");if(bt)bt.onclick=toggleTheme;
  var bg=el("btnGuia");if(bg)bg.onclick=helpCentral;
  var ba=el("btnAbout");if(ba)ba.onclick=showAbout;
  var mb=el("menuBtn"),mp=el("menuPop");
  if(mb&&mp){
    mb.onclick=function(e){e.stopPropagation();mp.hidden=!mp.hidden;};
    document.addEventListener("click",function(e){if(!mp.hidden&&!mp.contains(e.target)&&e.target!==mb)mp.hidden=true;});
    mp.querySelectorAll(".menu-item").forEach(function(it){it.addEventListener("click",function(){mp.hidden=true;});});
  }
  el("btnExport").onclick=async function(){
    var name=slug(S.proyecto.nombre)+".json", json=JSON.stringify(S,null,2);
    var dl=(window.claude&&claude.use)?await claude.use("downloads"):null;
    if(dl){try{await dl.save({filename:name,data:json});return;}catch(e){if(e&&e.code==="declined")return;}}
    download(name,json);
  };
  el("btnImport").onclick=function(){el("fileInput")._mode="ours";el("fileInput").click();};
  el("btnImportRedOT").onclick=function(){el("fileInput")._mode="redot";el("fileInput").click();};
  el("fileInput").onchange=function(e){
    var f=e.target.files[0];if(!f)return;var mode=e.target._mode;var r=new FileReader();
    r.onload=function(){try{var obj=JSON.parse(r.result);
      if(mode==="redot"){importRedOT(obj);}
      else{S=obj;sanitizeState();uid=1;["activos","zonas","conductos","escenarios"].forEach(function(c){(S[c]||[]).forEach(function(o){var m=(""+o.id).match(/\d+/);if(m)uid=Math.max(uid,+m[0]+1);});});S._step=0;save();render();
        showModal("✓ Proyecto cargado",
         '<p style="font-size:14px">Se ha cargado el proyecto <b>'+esc(S.proyecto.nombre)+'</b>.</p>'+
         '<ul style="font-size:14px;line-height:1.7;margin:8px 0 14px">'+
         '<li><b>'+S.activos.length+'</b> activos</li>'+
         '<li><b>'+S.zonas.length+'</b> zonas · <b>'+S.conductos.length+'</b> conductos</li>'+
         '<li><b>'+S.escenarios.length+'</b> escenarios de amenaza</li>'+
         '</ul>'+
         '<p class="hint">Estás en el <b>paso 1</b>. Continúa por los pasos para revisar o completar la evaluación.</p>');}
    }catch(err){alert("JSON no válido: "+err.message);}
    e.target.value="";};
    r.readAsText(f);
  };
  el("btnPDF").onclick=function(){S._step=6;save();render();setTimeout(function(){window.print();},200);};
  el("btnReset").onclick=function(){confirmModal("¿Empezar una evaluación nueva? Se perderá la actual si no la has exportado.",function(){S=newProject();applyTheme(loadTheme());save();render();});};
  el("prev").onclick=function(){if(S._step>0){S._step--;save();render();}};
  el("next").onclick=function(){if(S._step<STEPS.length-1){S._step++;save();render();}};
}

/* ============================ INIT ============================ */
(function(){ if(!load())S=newProject(); applyTheme(loadTheme()); bindTop();
  try{render();}catch(e){ try{console.error(e);}catch(_){ } S=newProject(); save(); render(); }
})();
