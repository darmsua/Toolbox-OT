/* ---- Paso 6: Riesgo y SL ---- */
function stRiesgo(){
  if(!S.escenarios.length)return '<div class="card"><h2>Riesgo y SL</h2><div class="empty">Define escenarios de amenaza primero.</div></div>';
  var rows=riskRows();
  var body=rows.map(function(o){
    var dimN=o.sc.dim==="S"?"Safety":"Medioambiente";
    var mark=o.av?' <span title="Regla de aversión aplicada: el riesgo se elevó a '+RISK_NAME[S.proyecto.config.aversionFloor||4]+'" style="color:var(--accent);font-weight:700">▲</span>'
      :(o.avMiss?' <span title="Regla de aversión NO aplicada: impacto en '+dimN+' = '+IPLABEL[o.r.imp]+', por debajo del gatillo ('+RISK_NAME[S.proyecto.config.umbral]+' o superior). Valora '+dimN+' del activo en el Paso 3 para activarla." style="color:var(--accent);cursor:help;font-weight:700">△</span>':'');
    var tacLine=riskHideTac?'':'<div class="muted" style="font-size:11px">'+esc(o.t.tac||"")+'</div>';
    return '<tr><td>'+activoCellHTML(o.a)+'</td><td><b>'+esc(o.sc.amenaza)+'</b> '+esc(o.t.n)+tacLine+'</td>'+
     '<td style="text-align:center">'+o.sc.dim+'</td>'+
     '<td style="text-align:center"><span class="riskbadge rb'+o.r.imp+'">'+IPLABEL[o.r.imp]+'</span></td>'+
     '<td style="text-align:center"><span class="riskbadge rb'+o.r.prob+'">'+IPLABEL[o.r.prob]+'</span></td>'+
     '<td style="text-align:center"><span class="riskbadge rb'+o.r.band+'">'+RISK_NAME[o.r.band]+'</span>'+mark+'</td></tr>';
  }).join("");
  return '<div class="card">'+
   '<div class="zc-sticky noprint">'+
     '<h2 style="margin:0 0 2px">Riesgo calculado</h2>'+
     '<p class="lead" style="margin:0 0 8px">Impacto (propagado por dependencias) × probabilidad, con la regla de aversión marcada con ▲.</p>'+
     '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" id="riskhelp">ℹ️ Guía: cómo se calcula el riesgo</button></div><div style="display:flex;gap:8px"><button class="btn sm" data-stepcsv>⤓ CSV</button><button class="btn sm" data-steppdf>⤓ PDF</button></div></div>'+
     tblCap(S.escenarios.length,'escenario')+
   '</div>'+
   '<div class="scwrap"><table id="riskTable"><thead><tr>'+
     '<th style="min-width:210px">Activo <span class="vsortpick">'+rLk("activo","Activo")+rLk("tipo","Tipo")+rLk("zona","Zona")+'</span></th>'+
     '<th style="min-width:200px">Amenaza <span class="vsortpick">'+rLk("amenaza","Técnica")+'</span> <span id="tacToggle" title="Mostrar u ocultar la táctica" style="cursor:pointer;color:var(--teal);font-size:11px;font-weight:600;user-select:none">'+(riskHideTac?'▸ táctica':'▾ táctica')+'</span></th>'+
     rTh("dim","Dim.",true)+rTh("imp","Impacto",true)+rTh("prob","Prob.",true)+rTh("riesgo","Riesgo",true)+'</tr></thead><tbody>'+body+'</tbody></table></div>'+
   legendBlock(
     '<div class="lrow"><span class="lk">Dim.</span><span class="lv">dimensión comprometida: D Disponibilidad · I Integridad · C Confidencialidad · A Autenticidad · T Trazabilidad · S Safety · E Medioambiente.</span></div>'+
     '<div class="lrow"><span class="lk">Impacto y Prob.</span><span class="lv">bandas: MB Muy bajo/a · B Bajo/a · M Medio/a · A Alto/a · MA Muy alto/a.</span></div>'+
     '<div class="lrow"><span class="lk">Riesgo</span><span class="lv">Impacto × Prob. (matriz 5×5): MB · B · M · A · C Crítico. <b style="color:var(--accent)">▲</b> aversión aplicada (riesgo elevado). <b style="color:var(--accent)">△</b> escenario Safety/M.Amb. con impacto por debajo del gatillo: la regla no aplica (pasa el ratón para ver por qué).</span></div>'
   )+
  '</div>';
}

/* ---- Paso 7: Resultados ---- */
function stResultados(){
  var escen=S.escenarios.map(function(sc){var r=scenarioRisk(sc);return {sc:sc,r:r};});
  var crit=escen.filter(function(o){return o.r.band>=4;}).length;
  var maxb=escen.reduce(function(m,o){return Math.max(m,o.r.band);},0);
  var kpi='<div class="kpi" style="margin-top:14px">'+
    '<div class="k"><div class="n">'+S.activos.length+'</div><div class="l">activos</div></div>'+
    '<div class="k"><div class="n">'+S.zonas.length+'</div><div class="l">zonas</div></div>'+
    '<div class="k"><div class="n">'+S.escenarios.length+'</div><div class="l">escenarios</div></div>'+
    '<div class="k" style="border-top-color:var(--accent)"><div class="n">'+crit+'</div><div class="l">riesgo alto/crítico</div></div>'+
  '</div>';
  // mapa de calor por zona (clic para filtrar el registro)
  var heat=S.zonas.length?('<div class="heat">'+S.zonas.map(function(z){
    var b=zoneRisk(z.id)||1;var seld=(resZoneFilter===z.id);
    return '<div class="z'+(seld?' zsel':'')+'" data-zonefilter="'+z.id+'" title="Filtrar el registro por esta zona" style="background:var(--r'+b+'b);cursor:pointer">'+esc(z.nombre)+'<div style="font-weight:600;font-size:12px;opacity:.95">SL-T '+(z.slt||1)+' · riesgo '+RISK_NAME[b]+'</div></div>';
  }).join("")+'</div>'):'<div class="empty">Define zonas para ver el mapa de calor.</div>';
  // registro priorizado (ordenable + filtrable)
  var rows=resRows();
  var reg=rows.map(function(o){
    return '<tr><td style="text-align:center"><span class="riskbadge rb'+o.r.band+'">'+RISK_NAME[o.r.band]+'</span></td><td>'+activoCellHTML(o.a)+'</td><td><b>'+esc(o.sc.amenaza)+'</b> '+esc(o.t.n)+'</td><td style="text-align:center">'+o.sc.dim+'</td><td class="muted" style="font-size:12px">'+esc(o.sc.nota||"")+'</td></tr>';
  }).join("");
  var zf=resZoneFilter?(S.zonas.find(function(z){return z.id===resZoneFilter;})||{}):null;
  var chip=zf?('<div class="noprint" style="margin:0 0 6px"><span style="display:inline-flex;align-items:center;gap:7px;background:var(--soft2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px">Filtrado por zona: <b>'+esc(zf.nombre)+'</b> <button class="btn sm" id="resZoneClear" style="padding:1px 8px">✕ quitar</button></span></div>'):'';
  return '<div class="card">'+
   '<div class="zc-sticky noprint">'+
     '<h2 style="margin:0 0 2px">Resultados</h2>'+
     '<p class="lead" style="margin:0 0 8px">Resumen de la evaluación, mapa de calor por zona y registro de riesgos priorizado.</p>'+
     '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" id="reshelp">ℹ️ Guía: interpretar resultados</button></div><div style="display:flex;gap:8px"><button class="btn sm" data-stepcsv>⤓ CSV</button><button class="btn sm" data-steppdf>⤓ PDF</button></div></div>'+
     kpi+
     '<h3 style="color:var(--navy);font-size:15px;margin:12px 0 8px">Mapa de calor por zona</h3>'+
     (S.zonas.length?'<p class="muted" style="font-size:11.5px;margin:-4px 0 8px">Pulsa una zona para filtrar el registro por ella.</p>':'')+heat+
     '<h3 style="color:var(--navy);font-size:15px;margin:14px 0 6px">Registro de riesgos priorizado</h3>'+
     chip+(S.escenarios.length?tblCap(rows.length,'escenario'):'')+
   '</div>'+
   (S.escenarios.length?(
     '<div class="scwrap"><table id="resTable"><thead><tr>'+resTh("riesgo","Riesgo",true)+'<th style="min-width:210px">Activo <span class="vsortpick">'+resLk("activo","Activo")+resLk("tipo","Tipo")+resLk("zona","Zona")+'</span></th>'+resTh("amenaza","Amenaza")+resTh("dim","Dim.",true)+resTh("nota","Nota")+'</tr></thead><tbody>'+reg+'</tbody></table></div>'
   ):'<div class="empty">Sin escenarios evaluados.</div>')+
   '<div class="note noprint" style="margin-top:12px">Exporta el proyecto a JSON (para entregar) o genera el informe PDF desde la barra superior.</div>'+
  '</div>';
}

function slug(s){return (s||"proyecto").toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"");}

function importRedOT(obj){
  // tolerante: busca un array de dispositivos con type/props/zone
  var devs=null;
  if(Array.isArray(obj))devs=obj;
  else devs=obj.devices||obj.activos||obj.nodes||(obj.state&&obj.state.devices)||null;
  if(!devs||!devs.length){alert("No encontré dispositivos en ese JSON de Red OT.");return;}
  var nz=0,nc=0;
  update(function(){
    // El nombre del proyecto pasa a ser el importado
    if(obj.nombre&&typeof obj.nombre==="string"&&obj.nombre.trim())S.proyecto.nombre=obj.nombre.trim();
    var idmap={};
    devs.forEach(function(d){
      var type=d.type||d.tipo||"server";
      var props=d.props||d;
      var dt=DT_BY_ID[type]||DT_BY_ID.server;
      var zcat=(props.zone||dt.zone||"IT");
      var lvl=(d.level!=null&&!isNaN(parseFloat(d.level)))?parseFloat(d.level):(TYPE_BAND[dt.id]!=null?TYPE_BAND[dt.id]:(ZONE_PURDUE[zcat]!=null?ZONE_PURDUE[zcat]:2));
      var aid=nid("a");
      if(d.id!=null)idmap[d.id]=aid;
      S.activos.push({id:aid,type:dt.id,nombre:props.name||props.nombre||dt.label,
        purdue:lvl,zonaCat:zcat,
        ip:props.ip||"",val:{},dependeDe:[],zonas:[],
        meta:{ref:props.ref||props.codigo_activo||"",clase:Array.isArray(props.clase)?props.clase.slice():(props.clase?[props.clase]:[]),ubicacion:props.ubicacion||props.location||"",vlan:props.vlan||"",mfr:props.manufacturer||dt.mfr||"",model:props.model||"",product_code:props.product_code||"",firmware:props.firmware||"",notes:props.notes||""}});
    });
    // Zonas dibujadas en el editor → zonas IEC 62443, con sus activos asignados
    var zmap={};
    (obj.zonas||[]).forEach(function(z){
      var zid=nid("z");zmap[z.id]=zid;nz++;
      S.zonas.push({id:zid,nombre:z.nombre||"Zona",slt:(z.slt>=1&&z.slt<=4)?z.slt:2});
      (z.devices||[]).forEach(function(did){var aid=idmap[did];if(!aid)return;var a=S.activos.find(function(x){return x.id===aid;});if(a){a.zonas=a.zonas||[];if(a.zonas.indexOf(zid)<0)a.zonas.push(zid);}});
    });
    // Conductos: conexiones del editor que cruzan de una zona a otra
    // · un conducto por cada PROTOCOLO distinto que cruza un par de zonas
    // · SL-T del conducto = máximo del SL-T de las dos zonas que une (IEC 62443-3-2)
    if(nz){
      var seen={};      // par de zonas + protocolo ya creado
      var orient={};    // orientación origen/destino fijada con el primer cruce de cada par
      function zslt(zid){var z=S.zonas.find(function(x){return x.id===zid;});return z?(z.slt||2):2;}
      (obj.conexiones||obj.conns||[]).forEach(function(c){
        var af=S.activos.find(function(x){return x.id===idmap[c.from];}),at=S.activos.find(function(x){return x.id===idmap[c.to];});
        if(!af||!at)return;
        var zf=(af.zonas||[])[0],zt=(at.zonas||[])[0];
        if(!zf||!zt||zf===zt)return;
        var pair=zf<zt?zf+"|"+zt:zt+"|"+zf;
        if(!orient[pair])orient[pair]={o:zf,d:zt};
        var _pp=(c.protocolos||c.proto||"").trim();
        var key=pair+"@@"+_pp.toLowerCase();
        if(seen[key])return;seen[key]=true;nc++;
        rememberProto(_pp);
        var o=orient[pair];
        S.conductos.push({id:nid("c"),origen:o.o,destino:o.d,protocolos:_pp,slt:Math.max(zslt(o.o),zslt(o.d))});
      });
    }
    S._step=0;
  });
  showModal("✓ Importación desde Red OT completada",
   '<p style="font-size:14px">Se ha importado el esquema <b>'+esc(S.proyecto.nombre)+'</b>.</p>'+
   '<ul style="font-size:14px;line-height:1.7;margin:8px 0 14px">'+
   '<li><b>'+devs.length+'</b> activos añadidos al inventario</li>'+
   '<li><b>'+nz+'</b> zona(s) IEC 62443'+(nz?' con sus activos asignados':'')+'</li>'+
   '<li><b>'+nc+'</b> conducto(s) entre zonas (uno por protocolo), con <b>SL-T = máximo de las dos zonas</b> que unen</li>'+
   '</ul>'+
   '<p class="hint">Revisa los datos del proyecto en el <b>paso 1</b> y continúa con la valoración (paso 3).</p>');
}

// Búsqueda de vulnerabilidades por activo (plan B: abre búsquedas prefilladas en fuentes oficiales).
// Las APIs de CISA/NVD/CIRCL no permiten CORS desde una página estática, así que en lugar de
// traer el informe a la app abrimos la búsqueda ya montada en una pestaña nueva. Sin servidor,
// sin límites de tasa y compatible con uso offline (los enlaces solo se usan al pulsarlos).
function cveURL(src,q){
  var e=encodeURIComponent((q||"").trim());
  if(!e)return "";
  if(src==="cisa")return "https://www.cisa.gov/news-events/cybersecurity-advisories?search_api_fulltext="+e;
  if(src==="nvd")return "https://duckduckgo.com/?q="+encodeURIComponent((q||"").trim()+" site:nvd.nist.gov");
  if(src==="cve")return "https://www.cve.org/CVERecord/SearchResults?query="+e;
  return "";
}
function openCveLookup(onlyId){
  var src=onlyId?S.activos.filter(function(a){return a.id===onlyId;}):S.activos;
  var rows=src.map(function(a){
    var mf=metaVal(a,"fabricante"),mo=metaVal(a,"modelo"),fw=metaVal(a,"firmware");
    return {a:a,mf:mf,mo:mo,fw:fw,has:!!(mf||mo)};
  });
  var conDatos=rows.filter(function(r){return r.has;});
  var sinDatos=rows.filter(function(r){return !r.has;});
  var body=conDatos.map(function(r){
    var q=(r.mo||r.mf||"").trim(); // marca solo si no hay modelo
    var meta=[r.mf&&('Fab.: '+esc(r.mf)),r.mo&&('Mod.: '+esc(r.mo)),r.fw&&('FW: '+esc(r.fw))].filter(Boolean).join(' · ');

      '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap"><b style="font-size:13.5px">'+esc(r.a.nombre||"(sin nombre)")+'</b><span class="muted" style="font-size:11px">'+meta+'</span></div>'+
      '<div style="display:flex;gap:8px;align-items:center;margin-top:7px;flex-wrap:wrap">'+
        '<input class="t cve-q" value="'+esc(q)+'" style="flex:1 1 200px;min-width:160px" placeholder="fabricante modelo…">'+
        '<button class="btn sm cve-go" data-src="cisa" title="Avisos ICS de CISA">CISA</button>'+
        '<button class="btn sm cve-go" data-src="nvd" title="Busca en NVD (CVSS) a través del buscador, acotado a nvd.nist.gov">NVD</button>'+
        '<button class="btn sm cve-go" data-src="cve" title="Ficha oficial del CVE">CVE.org</button>'+
      '</div></div>';
  }).join("");
  var aviso='<div style="font-size:12px;color:#5a6b80;background:var(--soft2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin:0 0 12px;line-height:1.5">'+
    'Abre la búsqueda ya montada en una <b>pestaña nueva</b> (requiere Internet). Ajusta el texto si quieres afinar. En <b>CISA</b>, marca el filtro <b>«ICS Advisory»</b> de la izquierda para quedarte solo con avisos industriales. El <b>firmware</b> suele ser demasiado específico para la búsqueda por palabra clave: úsalo para contrastar la <i>versión afectada</i> en el aviso.</div>';
  var sinHTML=sinDatos.length?('<div class="muted" style="font-size:12px;margin-top:10px">Sin fabricante/modelo (complétalos en el <b>Paso 2 · Inventario</b> para buscar): '+sinDatos.map(function(r){return esc(r.a.nombre||"?");}).join(", ")+'</div>'):'';
  var inner=aviso+(conDatos.length?body:'<div class="empty">Ningún activo tiene fabricante o modelo. Complétalos en el Paso 2 · Inventario.</div>')+sinHTML;
  var bg=document.createElement("div");bg.className="modal-bg";
  bg.innerHTML='<div class="modal" style="max-width:600px;max-height:82vh;overflow:auto"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px"><h3 style="margin:0">🔎 Buscar vulnerabilidades</h3><button class="btn sm" data-close>Cerrar</button></div>'+inner+'</div>';
  bg.addEventListener("click",function(e){
    if(e.target===bg||e.target.hasAttribute("data-close")){document.body.removeChild(bg);return;}
    var go=e.target.closest?e.target.closest(".cve-go"):null;
    if(go){var row=go.closest(".cve-row");var inp=row?row.querySelector(".cve-q"):null;var url=cveURL(go.getAttribute("data-src"),inp?inp.value:"");if(url)window.open(url,"_blank","noopener");}
  });
  bg.addEventListener("keydown",function(e){if(e.key==="Escape"&&document.body.contains(bg))document.body.removeChild(bg);});

  bg.addEventListener("click",function(e){if(e.target===bg||e.target.hasAttribute("data-close"))close();else if(e.target.hasAttribute("data-ok"))ok();else if(e.target.hasAttribute("data-del"))del();});

function helpCentral(){
  showModal("Guía completa de la aplicación",
   '<p style="font-size:14px">Esta herramienta evalúa el <b>riesgo en sistemas OT/ICS</b> combinando tres marcos: <b>IEC 62443-3-2</b> (proceso: zonas y conductos), <b>MAGERIT v3</b> (valoración de activos) y <b>MITRE ATT&CK for ICS</b> (amenazas). El trabajo se organiza en 7 pasos.</p>'+
   '<h4>Los 7 pasos</h4>'+
   '<ol style="font-size:13.5px;line-height:1.6">'+

   '<li><b>Amenazas</b> — crea escenarios con técnicas <b>ATT&CK for ICS</b>, indicando la dimensión afectada y la probabilidad.</li>'+
   '<li><b>Riesgo y SL</b> — riesgo por escenario (impacto × probabilidad) y agregado por zona.</li>'+

   '<h4>SL-T (IEC 62443)</h4>'+
   '<p style="font-size:13.5px;line-height:1.6"><b>SL-T</b> (Security Level Target, 1–4) es el nivel de seguridad objetivo de cada zona/conducto según el atacante del que debe protegerse (de SL 1, error accidental, a SL 4, atacante con amplios recursos). El objetivo del proceso es alcanzar <b>SL-A ≥ SL-T</b>.</p>'+
   '<h4>MAGERIT — dimensiones</h4>'+
   '<p style="font-size:13.5px;line-height:1.6"><b>D</b> Disponibilidad · <b>I</b> Integridad · <b>C</b> Confidencialidad · <b>A</b> Autenticidad · <b>T</b> Trazabilidad · <b>S</b> Safety (seguridad física) · <b>E</b> Medioambiente. En OT, D y S suelen pesar más que C.</p>'+
   '<h4>Integración con «Red OT»</h4>'+
   '<p style="font-size:13.5px;line-height:1.6">Diseña la arquitectura en el editor <b>Red OT</b>, dibuja las zonas (con SL-T) y exporta el JSON. Aquí usa <b>Archivo → Importar Red OT</b>: se crean automáticamente los activos, las zonas y los conductos. El nombre del proyecto se toma del esquema importado.</p>'+

    r.onload=function(){try{var obj=JSON.parse(r.result);
      if(mode==="redot"){importRedOT(obj);}
      else{S=obj;sanitizeState();uid=1;["activos","zonas","conductos","escenarios"].forEach(function(c){(S[c]||[]).forEach(function(o){var m=(""+o.id).match(/\d+/);if(m)uid=Math.max(uid,+m[0]+1);});});S._step=0;save();render();
        showModal("✓ Proyecto cargado",
         '<p style="font-size:14px">Se ha cargado el proyecto <b>'+esc(S.proyecto.nombre)+'</b>.</p>'+
         '<ul style="font-size:14px;line-height:1.7;margin:8px 0 14px">'+
         '<li><b>'+S.activos.length+'</b> activos</li>'+
         '<li><b>'+S.zonas.length+'</b> zonas · <b>'+S.conductos.length+'</b> conductos</li>'+
         '<li><b>'+S.escenarios.length+'</b> escenarios de amenaza</li>'+
         '</ul>'+
         '<p class="hint">Estás en el <b>paso 1</b>. Continúa por los pasos para revisar o completar la evaluación.</p>');}
    }catch(err){alert("JSON no válido: "+err.message);}
    e.target.value="";};
    r.readAsText(f);
  };
  el("btnPDF").onclick=reportDialog;
  el("btnReset").onclick=function(){confirmModal("¿Empezar una evaluación nueva? Se perderá la actual si no la has exportado.",function(){S=newProject();applyTheme(loadTheme());save();render();});};
  el("prev").onclick=function(){if(S._step>0){S._step--;save();render();}};
  el("next").onclick=function(){if(S._step<STEPS.length-1){S._step++;save();render();}};
}

/* ============================ INIT ============================ */
(function(){ if(!load())S=newProject(); applyTheme(loadTheme()); bindTop();
  try{render();}catch(e){ try{console.error(e);}catch(_){ } S=newProject(); save(); render(); }
})();
</script>
