<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proveedores-OT · Toolbox-OT</title>
<meta name="description" content="Gestión de proveedores y riesgos de la cadena de suministro en entornos OT. Toolbox-OT.">

<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --ink:#1d2330; --muted:#5d6676; --line:#d9dde4; --line2:#eceef2;
  --acc:#0b6e74; --acc-soft:#e3f1f2; --acc-ink:#ffffff;
  --alta:#b42318; --alta-bg:#fde8e6; --media:#a15c07; --media-bg:#fdf1dc; --baja:#2f6f3e; --baja-bg:#e5f3e8;
  --info-bg:#eef2f8; --radius:8px; --shadow:0 1px 2px rgba(16,24,40,.06);
  --font: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
:root[data-theme="dark"]{
    --bg:#14171c; --panel:#1c2027; --ink:#e7e9ee; --muted:#9aa3b2; --line:#323844; --line2:#272c35;
    --acc:#3fb1b8; --acc-soft:#173538; --acc-ink:#0d1114;
    --alta:#ff8b7e; --alta-bg:#3d1d1a; --media:#f3b35b; --media-bg:#3a2b14; --baja:#7fcf92; --baja-bg:#1a3222;
    --info-bg:#222a36; --shadow:none;
  }
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh}
body{font-family:var(--font);font-size:14px;color:var(--ink);background:var(--bg);line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}

/* cabecera */
header.top{display:flex;align-items:center;gap:16px;padding:0 18px;height:54px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{display:flex;flex-direction:column;line-height:1.1;min-width:150px}
.brand b{font-size:16px;letter-spacing:.2px}
.brand span{font-size:11px;color:var(--muted)}
nav.tabs{display:flex;gap:2px;flex:1;overflow-x:auto}
nav.tabs button{background:none;border:0;padding:8px 12px;border-radius:6px;cursor:pointer;color:var(--muted);white-space:nowrap}
nav.tabs button:hover{background:var(--line2);color:var(--ink)}
nav.tabs button.on{background:var(--acc-soft);color:var(--acc);font-weight:600}
.proj{font-size:12px;color:var(--muted);text-align:right;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

main{padding:18px;max-width:1500px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px} h2{font-size:16px;margin:0 0 10px} h3{font-size:14px;margin:14px 0 8px}
.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.kpi .v{font-size:26px;font-weight:700;line-height:1.1}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi.warn .v{color:var(--alta)}

/* diseño con lista lateral */
.split{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;align-items:start}
.side{position:sticky;top:72px}
.plist{list-style:none;margin:0;padding:0;max-height:calc(100vh - 210px);overflow:auto}
.plist li{padding:9px 10px;border-radius:6px;cursor:pointer;border:1px solid transparent;margin-bottom:2px}
.plist li:hover{background:var(--line2)}
.plist li.on{background:var(--acc-soft);border-color:var(--acc)}
.plist .n{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plist .m{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:2px}

/* formularios */
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
label.f > span{font-weight:600}
input[type=text],input[type=email],input[type=date],input[type=search],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;font-size:14px;color:var(--ink)}
textarea{resize:vertical;min-height:64px;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:var(--acc)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.chk input{margin-top:3px;width:16px;height:16px;accent-color:var(--acc)}
.chk:last-child{border-bottom:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.spacer{flex:1}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:6px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.08);color:var(--acc-ink)}
.btn.danger{color:var(--alta)} .btn.danger:hover{border-color:var(--alta)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:none}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* insignias */
.b{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;letter-spacing:.2px;white-space:nowrap}
.b.alta{color:var(--alta);background:var(--alta-bg)} .b.media{color:var(--media);background:var(--media-bg)} .b.baja{color:var(--baja);background:var(--baja-bg)}
.b.n{color:var(--muted);background:var(--line2);font-weight:600}
.b.acc{color:var(--acc);background:var(--acc-soft)}

/* tablas */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:7px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:var(--line2)}
table.t td input,table.t td select,table.t td textarea{font-size:13px;padding:5px 7px}
table.t td textarea{min-height:38px}
.c{text-align:center} .nw{white-space:nowrap} .mut{color:var(--muted)} .sm{font-size:12px}
.overdue{color:var(--alta);font-weight:600}

/* matriz de riesgo */
table.t.risk{min-width:1040px}
table.t.risk td:first-child{min-width:230px}
table.t td select.pi,table.t.risk td select{min-width:52px}
.plist .m{flex-wrap:wrap}
.hm{display:inline-grid;grid-template-columns:auto repeat(3,64px);grid-template-rows:repeat(3,52px) auto;gap:4px;align-items:center}
.hm .cell{height:52px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.hm .ax{font-size:11px;color:var(--muted);text-align:center}
.hm .ay{font-size:11px;color:var(--muted);text-align:right;padding-right:6px}
.lv1{background:var(--baja-bg);color:var(--baja)} .lv2{background:var(--media-bg);color:var(--media)} .lv3{background:var(--alta-bg);color:var(--alta)}
.hm .cell.zero{opacity:.45;font-weight:400}

.note{background:var(--info-bg);border-radius:6px;padding:10px 12px;font-size:13px}
.note.warn{background:var(--alta-bg);color:var(--alta)}
.note.ok{background:var(--baja-bg);color:var(--baja)}
.empty{color:var(--muted);text-align:center;padding:36px 12px}
.sec-tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sec-tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;color:var(--muted);margin-bottom:-1px}
.sec-tabs button.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:600}

/* editor de documentos */
.blk{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px;background:var(--panel)}
.blk .bh{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.blk .bh .k{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.blk.sec{background:var(--acc-soft);border-color:transparent}
.params{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-top:8px}
.addbar{border:1px dashed var(--line);border-radius:var(--radius);padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.addbar select{width:auto;max-width:320px}

/* vista de documento (pantalla e impresión) */
.docv{background:#fff;color:#111;border:1px solid var(--line);border-radius:4px;padding:48px 56px;max-width:820px;margin:0 auto;font-family:Georgia,"Times New Roman",serif;font-size:11.5pt;line-height:1.5}
.docv h1{font-size:18pt;margin:0 0 4px;font-family:var(--font)}
.docv .meta{color:#555;font-size:9.5pt;margin:0 0 22px;font-family:var(--font);border-bottom:1px solid #ccc;padding-bottom:10px}
.docv h2{font-size:13pt;margin:22px 0 8px;font-family:var(--font)}
.docv h3{font-size:11pt;margin:16px 0 6px;font-family:var(--font)}
.docv p{margin:0 0 9px}
.docv table{width:100%;border-collapse:collapse;font-size:9.5pt;margin:6px 0 12px;font-family:var(--font)}
.docv th,.docv td{border:1px solid #999;padding:5px 6px;vertical-align:top;text-align:left}
.docv th{background:#eef0f2}
.docv .firmas{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:40px;font-family:var(--font);font-size:10pt}
.docv .firmas div{border-top:1px solid #333;padding-top:6px}
.docv .pie{margin-top:30px;color:#777;font-size:8pt;font-family:var(--font)}

#print-area{display:none}
@media print{
  body.printing > *:not(#print-area){display:none !important}
  body.printing #print-area{display:block}
  body.printing{background:#fff}
  #print-area .docv{border:0;padding:0;max-width:none}
  @page{size:A4;margin:20mm 18mm}
  .docv table{page-break-inside:auto} .docv tr{page-break-inside:avoid}
}

.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
footer.foot{color:var(--muted);font-size:11px;text-align:center;padding:16px}
@media (max-width:900px){ .split{grid-template-columns:1fr} .side{position:static} .g2,.g3{grid-template-columns:1fr} .proj{display:none} }

/* ordenación y modal de la biblioteca */
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--acc)}
th.sortable .arr{font-size:10px;opacity:.6}
.modal-bg{position:fixed;inset:0;background:rgba(10,14,20,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:30;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;width:min(720px,100%);box-shadow:0 12px 40px rgba(0,0,0,.25)}

/* menú de la suite Toolbox-OT */
.suite{position:relative}
#menubtn{font-size:12.5px;color:var(--muted);border:1px solid var(--line);background:none;border-radius:6px;padding:6px 10px;cursor:pointer;white-space:nowrap}
#menubtn:hover,#menubtn[aria-expanded=true]{color:var(--acc);border-color:var(--acc)}
.dropdown{position:absolute;right:0;top:calc(100% + 6px);min-width:220px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px;z-index:40}
.dropdown a,.dropdown button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:6px;font-size:13px;color:var(--ink);text-decoration:none;background:none;border:0;cursor:pointer}
.dropdown a:hover,.dropdown button:hover,.dropdown a:focus,.dropdown button:focus{background:var(--acc-soft);color:var(--acc);outline:none}
.dd-sec{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:6px 10px 4px}
.dd-sep{height:1px;background:var(--line);margin:6px 4px}
.ver{font-size:10px;font-weight:700;background:var(--acc-soft);color:var(--acc);padding:1px 6px;border-radius:10px;margin-left:4px}

/* ayuda de la matriz */
details.ayuda > summary{cursor:pointer;list-style:none;display:flex;gap:10px;align-items:baseline}
details.ayuda > summary::-webkit-details-marker{display:none}
details.ayuda > summary::before{content:"▸";color:var(--acc);font-size:12px}
details.ayuda[open] > summary::before{content:"▾"}
details.ayuda{scroll-margin-top:70px}
.lvchip{display:inline-block;font-weight:700;font-size:12px;padding:2px 8px;border-radius:6px;white-space:nowrap}

/* Biblioteca: cabecera, pestañas, barra de botones y encabezados de tabla fijos */
.bib-top{position:sticky;top:var(--h-hdr,54px);z-index:8;background:var(--bg);margin:-18px -18px 0;padding:18px 18px 0}
.bib-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.bib-head h1{margin:0}
.bib-top .sub{margin:0 0 10px;font-size:13px}
.bib-tabs{margin-bottom:0;background:var(--bg)}
.bib-body{border-top-left-radius:0;border-top-right-radius:0;padding-top:0}
.bib-bar{position:sticky;top:calc(var(--h-hdr,54px) + var(--h-bibtop,0px));z-index:7;background:var(--panel);padding:12px 0 10px;border-bottom:1px solid var(--line)}
table.t.stick thead th{position:sticky;top:calc(var(--h-hdr,54px) + var(--h-bibtop,0px) + var(--h-bibbar,0px));z-index:6;background:var(--panel);box-shadow:0 1px 0 var(--line)}

</style>
</head>

<script>
/* tema compartido con el resto de Toolbox-OT (clave "toolbox_theme") */
(function(){
  function get(){try{return localStorage.getItem("toolbox_theme")||"light";}catch(e){return "light";}}
  function apply(t){if(t==="dark")document.documentElement.setAttribute("data-theme","dark");else document.documentElement.removeAttribute("data-theme");var b=document.getElementById("themebtn");if(b)b.textContent=t==="dark"?"☀️ Tema claro":"🌙 Tema oscuro";}
  apply(get());
  window.addEventListener("storage",function(e){if(e.key==="toolbox_theme")apply(get());});
  document.getElementById("themebtn").onclick=function(){var n=get()==="dark"?"light":"dark";try{localStorage.setItem("toolbox_theme",n);}catch(e){}apply(n);};
  /* menú desplegable de la suite */
  var mb=document.getElementById("menubtn"), mm=document.getElementById("suitemenu");
  function cerrar(){mm.hidden=true;mb.setAttribute("aria-expanded","false");}
  mb.onclick=function(e){e.stopPropagation();var abrir=mm.hidden;mm.hidden=!abrir;mb.setAttribute("aria-expanded",abrir?"true":"false");if(abrir){var f=mm.querySelector("[role=menuitem]");if(f)f.focus();}};
  document.addEventListener("click",function(e){if(!mm.hidden&&!mm.contains(e.target)&&e.target!==mb)cerrar();});
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!mm.hidden){cerrar();mb.focus();}});
})();
/* Biblioteca por defecto de Proveedores-OT.
   Se puede exportar desde la app como biblioteca.json, editar y volver a importar. */

  "clausulas": [
    { "id": "C-CON-01", "categoria": "Confidencialidad", "titulo": "Objeto",
      "texto": "El presente acuerdo regula el tratamiento de la información confidencial que {{Organización}} facilite a {{Proveedor}} con motivo de {{Suministro}}." },
    { "id": "C-CON-02", "categoria": "Confidencialidad", "titulo": "Información confidencial",
      "texto": "Se considera información confidencial toda la información técnica de la instalación: esquemas de red, direcciones IP, credenciales, proyectos de PLC y SCADA, configuraciones, planos, procedimientos e informes de seguridad, con independencia del soporte en que se facilite." },
    { "id": "C-CON-03", "categoria": "Confidencialidad", "titulo": "Obligaciones del receptor",
      "texto": "{{Proveedor}} utilizará la información solo para el fin indicado, la compartirá únicamente con el personal que la necesite, que quedará obligado en los mismos términos, y la protegerá con medidas de seguridad al menos equivalentes a las que aplica a su propia información confidencial." },
    { "id": "C-CON-04", "categoria": "Confidencialidad", "titulo": "Excepciones",
      "texto": "No será confidencial la información que sea de dominio público sin incumplimiento de este acuerdo, que el receptor conociera previamente de forma legítima o que deba revelarse por obligación legal, en cuyo caso se avisará previamente a {{Organización}}." },
    { "id": "C-CON-05", "categoria": "Confidencialidad", "titulo": "Duración",
      "texto": "Las obligaciones de confidencialidad se mantendrán durante la relación contractual y {{anios_confidencialidad}} años después de su finalización.",
      "params": { "anios_confidencialidad": { "etiqueta": "Años de confidencialidad tras el contrato", "defecto": "5" } } },
    { "id": "C-CON-06", "categoria": "Confidencialidad", "titulo": "Devolución y destrucción",
      "texto": "Al terminar la relación, o cuando {{Organización}} lo solicite, {{Proveedor}} devolverá o destruirá de forma segura toda la información confidencial y sus copias, y lo certificará por escrito en un plazo de {{dias_destruccion}} días.",
      "params": { "dias_destruccion": { "etiqueta": "Plazo de certificación (días)", "defecto": "15" } } },
    { "id": "C-CON-07", "categoria": "Confidencialidad", "titulo": "Comunicación de fugas",
      "texto": "{{Proveedor}} comunicará a {{Organización}} cualquier acceso no autorizado o pérdida de información confidencial en un plazo máximo de {{plazo_incidentes_h}} horas desde que tenga conocimiento.",
      "params": { "plazo_incidentes_h": { "etiqueta": "Plazo de comunicación (horas)", "defecto": "24" } } },

    { "id": "C-SLA-01", "categoria": "Servicio (SLA)", "titulo": "Tiempos de respuesta",
      "texto": "{{Proveedor}} atenderá las incidencias con los siguientes tiempos máximos de respuesta: críticas (parada de producción o riesgo para la seguridad) {{t_critica_h}} horas; graves {{t_grave_h}} horas; leves {{t_leve_h}} horas.",
      "params": { "t_critica_h": { "etiqueta": "Respuesta incidencia crítica (h)", "defecto": "2" }, "t_grave_h": { "etiqueta": "Respuesta incidencia grave (h)", "defecto": "8" }, "t_leve_h": { "etiqueta": "Respuesta incidencia leve (h)", "defecto": "48" } } },
    { "id": "C-SLA-02", "categoria": "Servicio (SLA)", "titulo": "Notificación de incidentes de seguridad",
      "texto": "{{Proveedor}} notificará a {{Organización}} cualquier incidente de ciberseguridad que pueda afectar a la instalación en un plazo máximo de {{plazo_incidentes_h}} horas, indicando el alcance conocido y las medidas adoptadas.",
      "params": { "plazo_incidentes_h": { "etiqueta": "Plazo de notificación de incidentes (h)", "defecto": "24" } } },
    { "id": "C-SLA-03", "categoria": "Servicio (SLA)", "titulo": "Notificación de vulnerabilidades",
      "texto": "{{Proveedor}} informará a {{Organización}} de toda vulnerabilidad nueva que afecte a lo suministrado en un plazo de {{plazo_vuln_d}} días laborables, junto con las medidas de mitigación disponibles.",
      "params": { "plazo_vuln_d": { "etiqueta": "Plazo de notificación de vulnerabilidades (días)", "defecto": "5" } } },
    { "id": "C-SLA-04", "categoria": "Servicio (SLA)", "titulo": "Parches de seguridad",
      "texto": "{{Proveedor}} facilitará los parches de seguridad durante al menos {{anios_soporte}} años desde la entrega. Los parches se probarán antes de su publicación y se acompañarán de instrucciones de instalación y vuelta atrás.",
      "params": { "anios_soporte": { "etiqueta": "Años de soporte de seguridad", "defecto": "10" } } },
    { "id": "C-SLA-05", "categoria": "Servicio (SLA)", "titulo": "Informes periódicos",
      "texto": "{{Proveedor}} entregará cada {{periodo_informe}} un informe con las intervenciones realizadas, los accesos utilizados y los cambios efectuados en el sistema.",
      "params": { "periodo_informe": { "etiqueta": "Periodicidad del informe", "defecto": "trimestre" } } },
    { "id": "C-SLA-06", "categoria": "Servicio (SLA)", "titulo": "Penalizaciones",
      "texto": "El incumplimiento de los plazos anteriores dará lugar a una penalización del {{penalizacion_pct}} % de la facturación mensual del servicio por cada incumplimiento, con un máximo del {{penalizacion_max_pct}} %.",
      "params": { "penalizacion_pct": { "etiqueta": "Penalización por incumplimiento (%)", "defecto": "5" }, "penalizacion_max_pct": { "etiqueta": "Penalización máxima (%)", "defecto": "20" } } },

    { "id": "C-SEG-01", "categoria": "Seguridad técnica", "titulo": "Nivel de seguridad",
      "texto": "Los equipos y el sistema suministrados alcanzarán el nivel de seguridad {{sl_objetivo}} de IEC 62443-3-3 en la zona {{zona}}, según el esquema de zonas y conductos facilitado por {{Organización}}.",
      "params": { "sl_objetivo": { "etiqueta": "Nivel de seguridad objetivo", "defecto": "SL 2" }, "zona": { "etiqueta": "Zona", "defecto": "de control de la línea" } } },
    { "id": "C-SEG-02", "categoria": "Seguridad técnica", "titulo": "Credenciales",
      "texto": "El suministro se entregará sin contraseñas por defecto. Todas las credenciales podrán cambiarse y se entregarán a {{Organización}} de forma segura en el acta de recepción." },
    { "id": "C-SEG-03", "categoria": "Seguridad técnica", "titulo": "Bastionado",
      "texto": "Se desactivarán los puertos, servicios y cuentas no necesarios, según la guía de bastionado del fabricante, que se entregará con la documentación." },

function criticidadCalc(p) {
  const motivos = { alta: [], media: [], baja: [] };
  S.bib.preguntasCriticidad.forEach(q => { if (p.acceso[q.id]) motivos[q.nivel].push(q.id); });
  const nivel = motivos.alta.length ? "alta" : motivos.media.length ? "media" : "baja";
  return { nivel, motivos: motivos[nivel] };
}
const criticidad = p => p.criticidadManual || criticidadCalc(p).nivel;
const badgeCrit = n => `<span class="b ${n}">${n.toUpperCase()}</span>`;

function preguntasDe(p) { return S.bib.cuestionario.filter(q => aplica(q, p)); }
function evaluarCuestionario(p) {
  const qs = preguntasDe(p), crit = criticidad(p), R = p.cuestionario.respuestas;
  let pts = 0, max = 0, resp = 0; const elim = [];
  qs.forEach(q => {
    const v = (R[q.id] || {}).valor || "";
    if (v) resp++;
    if (v && v !== "na") { max += 2 * q.peso; pts += (v === "si" ? 2 : v === "parcial" ? 1 : 0) * q.peso; }
    if (v === "no" && (q.eliminatoria || []).includes(crit)) elim.push(q);
  });
  const pct = max ? Math.round(100 * pts / max) : 0;
  const umbral = { alta: [75, 50], media: [60, 40], baja: [40, 20] }[crit];
  let sug = "";
  if (!qs.length) sug = "Sin preguntas aplicables";
  else if (elim.length) sug = "No homologado";
  else if (resp < qs.length) sug = "Cuestionario incompleto";
  else sug = pct >= umbral[0] ? "Homologado" : pct >= umbral[1] ? "Homologado con condiciones" : "No homologado";
  return { qs, total: qs.length, resp, pct, elim, sug, umbral, crit };
}
const nivelR = (p, i) => (Number(p) || 0) * (Number(i) || 0);
const claseR = n => n >= 6 ? 3 : n >= 3 ? 2 : n >= 1 ? 1 : 0;
const textoR = n => ["—", "Aceptable", "A vigilar", "Inaceptable"][claseR(n)];
const badgeR = n => n ? `<span class="b ${["", "baja", "media", "alta"][claseR(n)]}">${n} · ${textoR(n)}</span>` : `<span class="b n">—</span>`;
const maxRiesgo = p => p.riesgos.reduce((m, r) => Math.max(m, nivelR(r.p, r.i)), 0);
function requisitosRecomendados(p) { const c = ORDEN[criticidad(p)]; return S.bib.requisitos.filter(r => aplica(r, p) && c >= ORDEN[r.criticidadMin || "baja"]); }
const vencida = p => p.proximaRev && p.proximaRev < hoy() && p.estado !== "Baja";

function heatmap(lista, residual) {
  const m = [[0, 0, 0], [0, 0, 0], [0, 0, 0]];
  lista.forEach(r => { const P = Number(residual ? r.pr : r.p), I = Number(residual ? r.ir : r.i); if (P && I) m[P - 1][I - 1]++; });
  let h = `<div class="hm">`;
  for (let P = 3; P >= 1; P--) {
    h += `<div class="ay">P${P}</div>`;
    for (let I = 1; I <= 3; I++) { const n = m[P - 1][I - 1]; h += `<div class="cell lv${claseR(P * I)} ${n ? "" : "zero"}" title="Probabilidad ${P} × Impacto ${I} = ${P * I}">${n}</div>`; }
  }
  h += `<div></div><div class="ax">I1</div><div class="ax">I2</div><div class="ax">I3</div></div>`;
  return h;
}
function ayudaMatriz(inac, inacRes) {

  return `<details class="card ayuda" data-ayuda="matriz" ${S.ayudaMatriz ? "open" : ""}><summary><b>ℹ Cómo se lee la matriz de riesgos</b> <span class="sm mut">inherente, residual y niveles aceptables</span></summary>
  <div class="grid g2" style="margin-top:12px;gap:24px">
    <div>
      <h3 style="margin-top:0">1. Cada riesgo se puntúa con dos números</h3>
      <p class="sm"><b>Probabilidad (P)</b> de que ocurra e <b>impacto (I)</b> si ocurre, de 1 (bajo) a 3 (alto). El impacto en OT se valora sobre la seguridad de las personas, el medio ambiente, la producción y la calidad.</p>
      <p class="sm"><b>Nivel de riesgo = P × I</b>, de 1 a 9. Solo hay seis valores posibles: 1, 2, 3, 4, 6 y 9.</p>
      <table class="t sm"><thead><tr><th>Nivel</th><th>Clase</th><th>Qué hay que hacer</th></tr></thead><tbody>
        <tr><td>${cel(1, "1 – 2")}</td><td><b>Aceptable</b></td><td>Se acepta tal cual y se revisa en la próxima evaluación del proveedor.</td></tr>
        <tr><td>${cel(3, "3 – 4")}</td><td><b>A vigilar</b></td><td>Se puede operar, pero conviene aplicar medidas con plazo y responsable.</td></tr>
        <tr><td>${cel(6, "6 – 9")}</td><td><b>Inaceptable</b></td><td>No se debe contratar ni poner en marcha así: hay que tratarlo antes.</td></tr>
      </tbody></table>
      <h3>2. Cómo se lee la cuadrícula</h3>
      <p class="sm">Las filas son la probabilidad (P3 arriba) y las columnas el impacto (I3 a la derecha). El número de cada celda es <b>cuántos riesgos</b> de todos los proveedores tienen esa combinación. Cuanto más arriba y a la derecha, peor: la esquina superior derecha (P3 × I3 = 9) es la zona más grave.</p>
    </div>
    <div>
      <h3 style="margin-top:0">3. Inherente y residual</h3>
      <p class="sm"><b>Riesgo inherente</b>: el que existe hoy, sin aplicar ninguna medida (columnas P e I del registro de riesgos).</p>
      <p class="sm"><b>Riesgo residual</b>: el que quedaría después de aplicar las medidas del tratamiento (columnas P res. e I res.). Los botones <i>Inherente</i> y <i>Residual</i> cambian la matriz entre los dos momentos.</p>
      <p class="sm">El indicador <b>«Riesgos inaceptables (inherente → residual)»</b>, ahora <b>${inac} → ${inacRes}</b>, resume el efecto del plan: cuántos riesgos están hoy en rojo y cuántos seguirían en rojo con las medidas propuestas.${inacRes ? " Si el número de la derecha no es 0, las medidas no bastan: hay que reforzarlas, evitar el riesgo (por ejemplo, cambiar de proveedor) o que la dirección lo acepte por escrito con su justificación." : " Un 0 a la derecha significa que, si se aplican las medidas, ningún riesgo queda en rojo."}</p>
      <h3>4. Qué mueve un riesgo en la matriz</h3>
      <ul class="sm" style="padding-left:18px;margin:0">
        <li><b>Reducir</b>: casi siempre baja la <b>probabilidad</b> (MFA, acceso bajo demanda, verificación en el SAT…). El <b>impacto</b> solo baja si se limita lo que el proveedor puede tocar: segmentación, mínimo privilegio o un plan para seguir produciendo.</li>
        <li><b>Evitar</b>: se elimina la causa (retirar el módem, no contratar). El residual suele quedar muy bajo.</li>
        <li><b>Compartir</b>: un seguro o una cláusula de responsabilidad compensan el daño económico, pero <b>no mueven el punto</b> en la matriz: la planta se sigue parando.</li>
        <li><b>Aceptar</b>: el residual es igual al inherente. Solo es razonable en verde, o con aprobación expresa de la dirección.</li>

    </div>

}

/* ---------- DOCUMENTOS ---------- */
/* Marcadores: {{Organización}} (alias {{cliente}}), {{Proveedor}}, {{Suministro}}, {{Fecha}} y los parámetros de cada cláusula.
   Sin distinguir mayúsculas ni tildes. Un marcador desconocido que no es un parámetro se imprime como texto, sin llaves. */
const normTok = t => String(t).normalize("NFD").replace(/[̀-ͯ]/g, "").trim().toLowerCase();
const TOK_ALIAS = { organizacion: "org", cliente: "org", organization: "org", empresa: "org", proveedor: "prov", suministro: "sum", fecha: "fecha" };
const RE_TOK = /\{\{\s*([^{}]+?)\s*\}\}/g;
function nombresDoc(p, d) {
  const org = (d && d.nombreOrg && d.nombreOrg.trim()) || S.data.proyecto.organizacion || "[Organización]";
  const prv = (d && d.nombreProv && d.nombreProv.trim()) || p.nombre || "[Proveedor]";
  if (d && d.marcadores) return { org: "{{Organización}}", prov: "{{Proveedor}}" };
  return { org, prov: prv };
}
function tokensDesconocidos(txt, params) {
  const out = []; String(txt || "").replace(RE_TOK, (m, k) => { const n = normTok(k); if (!TOK_ALIAS[n] && !(params && n in params) && !(params && k.trim() in params)) out.push(m); return m; });
  return [...new Set(out)];
}
function rellenar(txt, p, doc, params) {
  const sum = p.suministra ? (/^[A-ZÁÉÍÓÚÑ][a-záéíóúñ]/.test(p.suministra) ? p.suministra[0].toLowerCase() + p.suministra.slice(1) : p.suministra) : "[suministro]";
  const nm = nombresDoc(p, doc);
  const base = { org: nm.org, prov: nm.prov, sum, fecha: fechaES(doc && doc.fecha) };
  const s = String(txt || "");
  return s.replace(RE_TOK, (m, k, off) => {
    const n = normTok(k), alias = TOK_ALIAS[n];
    let v;
    if (alias) v = base[alias];
    else if (params && (params[k.trim()] !== undefined || params[n] !== undefined)) { v = params[k.trim()] ?? params[n]; if (v === "") v = `[${k.trim()}]`; }
    else if (/^[a-z0-9]+(_[a-z0-9]+)+$/i.test(k.trim())) v = `[${k.trim()}]`;
    else v = k.trim();
    if ((alias === "org" || alias === "prov") && !String(v).startsWith("{{") && (off === 0 || /[.:]\s*$/.test(s.slice(0, off)))) v = v.charAt(0).toUpperCase() + v.slice(1);
    if (String(v).endsWith(".") && s.charAt(off + m.length) === ".") v = String(v).slice(0, -1);
    return v;
  });
}
function bloqueDe(c) {
  const params = {}; Object.entries(c.params || {}).forEach(([k, v]) => params[k] = v.defecto);
  return { tipo: "clausula", ref: c.id, titulo: c.titulo, texto: c.texto, params };
}
const todasClausulas = () => [...S.bib.clausulas, ...S.bib.procedimientos];
function nuevoDocumento(p, plId) {
  const pl = S.bib.plantillas.find(x => x.id === plId); if (!pl) return null;
  const d = { id: uid("D"), plantilla: pl.id, tipo: pl.tipo, modo: pl.modo || "", titulo: pl.nombre, fecha: hoy(), version: "1.0", firmas: !!pl.firmas, resultado: "", bloques: [] };
  if (pl.intro) d.bloques.push({ tipo: "texto", texto: pl.intro });
  if (pl.tipo === "texto") {
    (pl.secciones || []).forEach(s => {
      d.bloques.push({ tipo: "seccion", titulo: s.titulo });
      [...(s.clausulas || []), ...(s.procedimientos || [])].forEach(id => { const c = todasClausulas().find(x => x.id === id); if (c) d.bloques.push(bloqueDe(c)); });
      if (s.requisitos) d.bloques.push({ tipo: "requisitos", items: requisitosRecomendados(p).map(r => ({ ref: r.id, categoria: r.categoria, texto: r.texto, verificacion: r.verificacion })) });
    });
    if (pl.registroAccesos) { d.bloques.push({ tipo: "seccion", titulo: "Registro de accesos" }); d.bloques.push({ tipo: "registro", filas: 8 }); }
  } else if (pl.tipo === "checklist") {
    const lista = S.bib.checklists[pl.modo] || [];
    d.bloques.push({ tipo: "checklist", modo: pl.modo, items: lista.map(textoCheck).map(t => pl.modo === "fatsat" ? { texto: t, fat: "", sat: "", obs: "" } : { texto: t, hecho: "", fecha: "", resp: "" }) });
  } else if (pl.tipo === "informe") {
    d.bloques.push({ tipo: "informe" });
    d.bloques.push({ tipo: "seccion", titulo: "Observaciones" }); d.bloques.push({ tipo: "texto", texto: "" });
  }
  return d;
}

function vDocumentos() {
  const p = prov();
  if (!p) return `<div class="split">${listaLateral("Documentos")}<div class="card empty">Selecciona un proveedor.</div></div>`;
  const d = docAct();
  const lista = `<div class="card"><div class="row"><h2 style="margin:0">Documentos de ${esc(p.nombre)}</h2>${badgeCrit(criticidad(p))}</div>

/* modelo intermedio del documento (para HTML y Word) */
function docElementos(p, d) {
  const nm = nombresDoc(p, d), org = nm.org;
  const E = [{ t: "title", text: rellenar(d.titulo, p, d) }, { t: "meta", text: `${nm.org} · ${nm.prov} · Versión ${d.version} · ${fechaES(d.fecha)}` }];
  let n = 0;
  d.bloques.forEach(b => {
    if (b.tipo === "seccion") E.push({ t: "h2", text: b.titulo });
    else if (b.tipo === "texto") { rellenar(b.texto, p, d).split(/\n+/).filter(x => x.trim()).forEach(x => E.push({ t: "p", text: x })); }
    else if (b.tipo === "clausula") { n++; E.push({ t: "clause", num: n, title: b.titulo, text: rellenar(b.texto, p, d, b.params) }); }
    else if (b.tipo === "requisitos") {
      [...new Set(b.items.map(r => r.categoria))].forEach(c => {
        E.push({ t: "h3", text: c });
        E.push({ t: "table", head: ["Ref.", "Requisito", "Verificación"], widths: [16, 56, 28], rows: b.items.filter(r => r.categoria === c).map(r => [r.ref, rellenar(r.texto, p, d), r.verificacion]) });
      });
    }
    else if (b.tipo === "registro") E.push({ t: "table", small: true, head: ["Fecha", "Técnico", "Remoto / planta", "Equipos", "Motivo", "Autoriza", "Inicio", "Cierre"], widths: [11, 14, 12, 14, 17, 12, 10, 10], rows: Array.from({ length: Math.min(40, Number(b.filas) || 8) }, () => ["", "", "", "", "", "", "", ""]) });
    else if (b.tipo === "checklist") {
      const fat = b.modo === "fatsat";
      E.push({ t: "table", head: fat ? ["N.º", "Verificación", "FAT", "SAT", "Observaciones"] : ["N.º", "Acción", "Hecho", "Fecha", "Responsable"], widths: fat ? [6, 52, 9, 9, 24] : [6, 54, 10, 14, 16], rows: b.items.map((it, j) => fat ? [String(j + 1), it.texto, it.fat, it.sat, it.obs] : [String(j + 1), it.texto, it.hecho, fechaES(it.fecha), it.resp]) });
      E.push({ t: "p", text: `Resultado: ${d.resultado || "____________________"}` });
    }
    else if (b.tipo === "informe") {
      const ev = evaluarCuestionario(p), cc = criticidadCalc(p);
      E.push({ t: "h2", text: "Datos del proveedor" });
      E.push({ t: "table", head: ["Campo", "Valor"], widths: [30, 70], rows: [["Razón social", p.nombre], ["CIF / NIF", p.cif], ["Tipo", tipoNombre(p.tipo)], ["Suministra", p.suministra], ["Contacto", [p.contacto, p.email, p.telefono].filter(Boolean).join(" · ")], ["Certificaciones", p.certificaciones], ["Estado", p.estado], ["Última evaluación", fechaES(p.ultimaEval)], ["Próxima revisión", fechaES(p.proximaRev)]] });
      E.push({ t: "h2", text: "Criticidad" });
      const accs = S.bib.preguntasCriticidad.filter(q => p.acceso[q.id]).map(q => q.texto.replace(/^¿|\?$/g, ""));
      E.push({ t: "p", text: `Criticidad ${criticidad(p).toUpperCase()}${p.criticidadManual ? ` (ajustada manualmente; calculada: ${cc.nivel}). Justificación: ${p.justificacion || "sin justificar"}` : " (calculada)"}.` });
      if (accs.length) E.push({ t: "p", text: "Motivos: " + accs.join("; ") + "." });
      const act = S.data.contexto.activos.filter(a => p.activos.includes(a.id));
      if (act.length) E.push({ t: "p", text: "Activos afectados: " + act.map(a => `${a.nombre} (${a.zona})`).join(", ") + "." });
      E.push({ t: "h2", text: "Cuestionario de homologación" });
      E.push({ t: "table", head: ["N.º", "Pregunta", "Respuesta", "Evidencia"], widths: [7, 55, 12, 26], rows: ev.qs.map(q => { const r = p.cuestionario.respuestas[q.id] || {}; return [q.id, q.texto, RESP[r.valor] || "—", r.evidencia || ""]; }) });
      E.push({ t: "p", text: `Respondidas ${ev.resp} de ${ev.total}. Puntuación ${ev.pct} %.${ev.elim.length ? " Falla eliminatoria: " + ev.elim.map(q => q.id).join(", ") + "." : ""} Resultado sugerido: ${ev.sug}. Resultado final: ${p.cuestionario.resultado || "pendiente"}.` });
      if (p.cuestionario.condiciones) E.push({ t: "p", text: "Condiciones: " + p.cuestionario.condiciones });
      E.push({ t: "h2", text: "Riesgos de la cadena de suministro" });
      if (p.riesgos.length) E.push({ t: "table", small: true, head: ["Riesgo", "P", "I", "Nivel", "Tratamiento", "Medidas", "Residual"], widths: [28, 5, 5, 12, 11, 27, 12], rows: p.riesgos.map(r => [r.descripcion, String(r.p), String(r.i), `${nivelR(r.p, r.i)} ${textoR(nivelR(r.p, r.i))}`, r.tratamiento, r.medidas, `${nivelR(r.pr, r.ir)} ${textoR(nivelR(r.pr, r.ir))}`]) });
      else E.push({ t: "p", text: "Sin riesgos registrados." });
    }
  });
  if (d.firmas) E.push({ t: "firmas", left: nm.org, right: nm.prov });
  E.push({ t: "pie", text: "Generado con Proveedores-OT · Toolbox-OT v1.9" });
  return E;
}
function docHTML(p, d) {

function bind(el) {

/* ---------- BIBLIOTECA: vista, ordenación y edición ---------- */
const TIPOS_IDS = () => S.bib.tiposProveedor.map(t => t.id);
const NIVELES = ["alta", "media", "baja"];
const LISTAS_CHECK = { fatsat: "FAT/SAT", baja: "Baja del proveedor" };

function normalizarBib(b) {
  b = Object.assign(clone(BIBLIOTECA_DEFECTO), b || {});
  ["amenazas", "cuestionario", "requisitos", "clausulas", "procedimientos", "plantillas"].forEach(k => { if (!Array.isArray(b[k])) b[k] = []; });
  b.checklists = b.checklists || {};
  Object.keys(LISTAS_CHECK).forEach(k => { if (!Array.isArray(b.checklists[k])) b.checklists[k] = []; });
  Object.entries(b.checklists).forEach(([k, lista]) => {
    const pref = k === "fatsat" ? "FS" : k === "baja" ? "BJ" : k.slice(0, 2).toUpperCase();
    b.checklists[k] = lista.map((x, i) => typeof x === "string" ? { id: `${pref}-${String(i + 1).padStart(2, "0")}`, texto: x } : x);
  });
  return b;
}
const textoCheck = x => typeof x === "string" ? x : x.texto;

/* Definición de cada categoría: columnas (ordenables), campos del formulario y ámbito del identificador */

  const D = {
    amenazas: { lista: () => S.bib.amenazas, nombre: "amenaza", ambito: () => S.bib.amenazas,

      campos: [["id", "Identificador", "id"], ["nombre", "Nombre", "text"], ["descripcion", "Descripción", "area"], ["caso", "Caso real", "text"], ["tipos", "Tipos de proveedor", "tipos"], ["medidas", "Medidas sugeridas (una por línea)", "lineas"]] },

      cols: [["_lista", "Checklist", x => LISTAS_CHECK[x._lista] || x._lista], ["_orden", "Orden", x => x._orden], ["id", "Id", x => x.id], ["texto", "Punto a verificar", x => x.texto]],

  D.procedimientos = Object.assign({}, D.clausulas, { lista: () => S.bib.procedimientos, nombre: "procedimiento" });

function tablaOrdenable(t, items, cols, acciones) {
  const so = S.bibSort[t] || {};
  let filas = items.map((x, i) => ({ x, i }));
  if (so.col) {
    const c = cols.find(c => c[0] === so.col);
    if (c) filas.sort((a, b) => { const va = c[2](a.x), vb = c[2](b.x); const r = typeof va === "number" && typeof vb === "number" ? va - vb : String(va ?? "").localeCompare(String(vb ?? ""), "es", { numeric: true, sensitivity: "base" }); return so.dir === "desc" ? -r : r; });
  }
  const th = cols.map(c => `<th class="sortable" data-act="bib-sort" data-col="${c[0]}" title="Ordenar por ${esc(c[1])}">${esc(c[1])} <span class="arr">${so.col === c[0] ? (so.dir === "desc" ? "▼" : "▲") : "↕"}</span></th>`).join("");
  return `<table class="t stick"><thead><tr>${th}${acciones ? "<th></th>" : ""}</tr></thead><tbody>${filas.map(({ x, i }) => `<tr>${cols.map(c => `<td class="${c[0] === "id" ? "nw" : ""}">${c[3] ? c[3](x) : c[0] === "id" ? `<b>${esc(c[2](x))}</b>` : esc(c[2](x))}</td>`).join("")}${acciones ? `<td class="nw">${acciones(x, i)}</td>` : ""}</tr>`).join("") || `<tr><td colspan="${cols.length + 1}" class="empty">Sin elementos</td></tr>`}</tbody></table>`;
}

/* ---- formulario modal ---- */
function modalBib() {
  const m = S.modal, def = catDef(m.cat), x = m.item;
  const cats = k => [...new Set(def.lista().map(i => i[k]).filter(Boolean))];
  const campo = ([k, lab, tipo]) => {
    const v = x[k];
    if (tipo === "id") return `<label class="f"><span>${lab} <span class="mut">(único; letras, números, guion, punto o guion bajo)</span></span><input type="text" name="id" value="${esc(v || "")}" maxlength="40" autocomplete="off"></label>`;
    if (tipo === "text") return `<label class="f"><span>${lab}</span><input type="text" name="${k}" value="${esc(v || "")}"></label>`;
    if (tipo === "area") return `<label class="f"><span>${lab}</span><textarea name="${k}" rows="4">${esc(v || "")}</textarea></label>`;
    if (tipo === "lineas") return `<label class="f"><span>${lab}</span><textarea name="${k}" rows="4">${esc((v || []).join("\n"))}</textarea></label>`;
    if (tipo === "cat") return `<label class="f"><span>${lab}</span><input type="text" name="${k}" value="${esc(v || "")}" list="dl-${k}"><datalist id="dl-${k}">${cats(k).map(c => `<option value="${esc(c)}">`).join("")}</datalist></label>`;
    if (tipo === "peso") return `<label class="f" style="max-width:160px"><span>${lab}</span><select name="peso">${[1, 2, 3].map(n => `<option ${Number(v || 1) === n ? "selected" : ""}>${n}</option>`).join("")}</select></label>`;
    if (tipo === "nivel") return `<label class="f" style="max-width:240px"><span>${lab}</span><select name="${k}">${NIVELES.map(n => `<option value="${n}" ${(v || "media") === n ? "selected" : ""}>${n}</option>`).join("")}</select></label>`;
    if (tipo === "niveles") return `<div class="f"><span class="sm" style="font-weight:600;color:var(--muted)">${lab}</span><div class="row">${NIVELES.map(n => `<label class="row sm" style="gap:4px"><input type="checkbox" name="${k}" value="${n}" ${(v || []).includes(n) ? "checked" : ""}> ${n}</label>`).join("")}</div></div>`;
    if (tipo === "tipos") { const todos = !v || v === "todos"; return `<div class="f"><span class="sm" style="font-weight:600;color:var(--muted)">${lab}</span><div class="row"><label class="row sm" style="gap:4px"><input type="checkbox" name="tipos-todos" ${todos ? "checked" : ""}> <b>Todos</b></label>${S.bib.tiposProveedor.map(tp => `<label class="row sm" style="gap:4px"><input type="checkbox" name="tipos" value="${tp.id}" ${!todos && v.includes(tp.id) ? "checked" : ""}> ${esc(tp.id)}</label>`).join("")}</div></div>`; }
    if (tipo === "params") return `<label class="f"><span>${lab}</span><textarea name="params" rows="3" placeholder="plazo_incidentes_h | Plazo de notificación (h) | 24">${esc(Object.entries(v || {}).map(([pk, pv]) => `${pk} | ${pv.etiqueta} | ${pv.defecto}`).join("\n"))}</textarea></label>`;
    if (tipo === "lista") return `<label class="f" style="max-width:260px"><span>${lab}</span><select name="_lista">${Object.keys(S.bib.checklists).map(l => `<option value="${l}" ${(v || "fatsat") === l ? "selected" : ""}>${esc(LISTAS_CHECK[l] || l)}</option>`).join("")}</select></label>`;
    return "";
  };
  return `<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-label="Editar ${esc(def.nombre)}">
    <div class="row" style="margin-bottom:12px"><h2 style="margin:0">${m.idx < 0 ? "Añadir" : "Editar"} ${esc(def.nombre)}</h2><span class="spacer"></span><button class="btn sm ghost" data-act="bib-cancel" title="Cerrar">✕</button></div>
    <form id="bib-form" class="grid" style="gap:12px" onsubmit="return false">${def.campos.map(campo).join("")}</form>
    <div id="bib-err" class="note warn" style="margin-top:12px;display:none"></div>

    <div class="row end" style="margin-top:16px"><button class="btn" data-act="bib-cancel">Cancelar</button><button class="btn pri" data-act="bib-save">Guardar</button></div>
  </div></div>`;
}

function siguienteId(t) {
  const pref = { amenazas: "T", cuestionario: "Q", requisitos: "R-NEW-", clausulas: "C-NEW-", procedimientos: "P-NEW-", checklists: "CK-" }[t];
  const usados = new Set(catDef(t).ambito().map(x => x.id));
  for (let n = 1; n < 1000; n++) { const id = pref + String(n).padStart(2, "0"); if (!usados.has(id)) return id; }
  return uid(pref);
}
function leerForm(t, prev) {
  const f = $("#bib-form"), g = n => (f.elements[n] ? f.elements[n].value : "").trim();
  const checks = n => [...f.querySelectorAll(`input[name="${n}"]:checked`)].map(i => i.value);
  const o = {};
  catDef(t).campos.forEach(([k, , tipo]) => {
    if (tipo === "tipos") o.tipos = f.querySelector('input[name="tipos-todos"]').checked ? "todos" : checks("tipos");
    else if (tipo === "niveles") o[k] = checks(k);
    else if (tipo === "lineas") o[k] = g(k).split(/\n+/).map(s => s.trim()).filter(Boolean);
    else if (tipo === "peso") o.peso = Number(g("peso")) || 1;
    else if (tipo === "params") {
      const ps = {};
      g("params").split(/\n+/).map(l => l.trim()).filter(Boolean).forEach(l => { const [k2, et, de] = l.split("|").map(s => (s || "").trim()); if (k2) ps[k2] = { etiqueta: et || k2, defecto: de || "" }; });
      if (Object.keys(ps).length) o.params = ps;
    }
    else o[k] = g(k);
  });
  return Object.assign({}, prev, o);
}
function validar(t, o, idOriginal) {
  const errs = [];
  if (!o.id) errs.push("El identificador es obligatorio.");
  else if (!/^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(o.id)) errs.push("El identificador solo puede contener letras, números, guion, punto y guion bajo, sin espacios.");
  else if (o.id.toLowerCase() !== String(idOriginal || "").toLowerCase() && catDef(t).ambito().some(x => String(x.id).toLowerCase() === o.id.toLowerCase()))
    errs.push(`Ya existe un elemento con el identificador «${o.id}»${t === "clausulas" || t === "procedimientos" ? " (cláusulas y procedimientos comparten identificadores)" : t === "checklists" ? " (en alguna de las checklists)" : ""}.`);
  const req = { amenazas: ["nombre"], cuestionario: ["texto", "bloque"], requisitos: ["texto", "categoria"], clausulas: ["titulo", "texto", "categoria"], procedimientos: ["titulo", "texto", "categoria"], checklists: ["texto"] }[t];
  req.forEach(k => { if (!o[k]) errs.push(`El campo «${catDef(t).campos.find(c => c[0] === k)[1]}» es obligatorio.`); });
  if (o.tipos !== undefined && o.tipos !== "todos" && !o.tipos.length) errs.push("Marca al menos un tipo de proveedor o «Todos».");
  if (o.params) Object.keys(o.params).forEach(k => { if (!/^[a-z0-9_]+$/i.test(k)) errs.push(`La clave de parámetro «${k}» solo puede llevar letras, números y guion bajo.`); });
  return errs;
}
/* Propaga un cambio de identificador a plantillas y datos del proyecto */
function renombrarRefs(t, viejo, nuevo) {
  if (!viejo || viejo === nuevo) return;
  if (t === "clausulas" || t === "procedimientos") S.bib.plantillas.forEach(pl => (pl.secciones || []).forEach(s => ["clausulas", "procedimientos"].forEach(k => { if (s[k]) s[k] = s[k].map(id => id === viejo ? nuevo : id); })));
  S.data.proveedores.forEach(p => {
    if (t === "amenazas") p.riesgos.forEach(r => { if (r.amenaza === viejo) r.amenaza = nuevo; });
    if (t === "cuestionario" && p.cuestionario.respuestas[viejo]) { p.cuestionario.respuestas[nuevo] = p.cuestionario.respuestas[viejo]; delete p.cuestionario.respuestas[viejo]; }
    p.documentos.forEach(d => d.bloques.forEach(b => {
      if ((t === "clausulas" || t === "procedimientos") && b.tipo === "clausula" && b.ref === viejo) b.ref = nuevo;
      if (t === "requisitos" && b.tipo === "requisitos") b.items.forEach(it => { if (it.ref === viejo) it.ref = nuevo; });
    }));
  });
}
function usos(t, id) {
  let n = 0;
  if (t === "clausulas" || t === "procedimientos") S.bib.plantillas.forEach(pl => (pl.secciones || []).forEach(s => n += [...(s.clausulas || []), ...(s.procedimientos || [])].filter(x => x === id).length));
  S.data.proveedores.forEach(p => {
    if (t === "amenazas") n += p.riesgos.filter(r => r.amenaza === id).length;
    if (t === "cuestionario" && p.cuestionario.respuestas[id]) n++;
  });
  return n;
}

Object.assign(ACC, {
  "bib-sort": el => { const t = S.bibTab, c = el.dataset.col, so = S.bibSort[t] || {}; S.bibSort[t] = so.col === c ? (so.dir === "asc" ? { col: c, dir: "desc" } : {}) : { col: c, dir: "asc" }; },
  "bib-sort-reset": () => { S.bibSort[S.bibTab] = {}; },
  "bib-new": () => { const t = S.bibTab; S.modal = { cat: t, idx: -1, foco: true, item: t === "checklists" ? { _lista: "fatsat", id: siguienteId(t) } : { id: siguienteId(t), tipos: "todos", peso: 1, criticidadMin: "media" } }; },
  "bib-edit": el => {
    const t = S.bibTab, id = el.dataset.id;
    if (t === "checklists") { const [k, l] = Object.entries(S.bib.checklists).find(([, l]) => l.some(x => x.id === id)); const i = l.findIndex(x => x.id === id); S.modal = { cat: t, idx: i, lista0: k, item: Object.assign({ _lista: k }, clone(l[i])) }; return; }
    const lista = catDef(t).lista(), i = lista.findIndex(x => x.id === id); S.modal = { cat: t, idx: i, item: clone(lista[i]) };
  },
  "bib-cancel": () => { S.modal = null; },
  "bib-save": () => {
    const m = S.modal, t = m.cat, o = leerForm(t, m.item), idOrig = m.idx >= 0 ? m.item.id : "";
    const errs = validar(t, o, idOrig);
    const box = $("#bib-err");
    if (errs.length) { box.innerHTML = errs.map(esc).join("<br>"); box.style.display = "block"; const inp = $('#bib-form [name="id"]'); if (inp && errs[0].includes("identificador")) inp.focus(); return false; }
    if (t === "checklists") {
      const destino = o._lista; delete o._lista; delete o._orden;
      if (m.idx >= 0) { S.bib.checklists[m.lista0].splice(m.idx, 1); if (m.lista0 === destino) S.bib.checklists[destino].splice(m.idx, 0, o); else S.bib.checklists[destino].push(o); }
      else S.bib.checklists[destino].push(o);
    } else {
      const lista = catDef(t).lista();
      if (m.idx >= 0) lista[m.idx] = o; else lista.push(o);
    }
    if (m.idx >= 0) renombrarRefs(t, idOrig, o.id);
    S.modal = null; toast(m.idx >= 0 ? "Cambios guardados" : "Elemento añadido");
  },
  "bib-del": el => {
    const t = S.bibTab, id = el.dataset.id, n = usos(t, id);
    if (!confirm(`¿Eliminar «${id}» de la biblioteca?${n ? `\n\nSe usa en ${n} sitio(s) (plantillas o evaluaciones). ${t === "clausulas" || t === "procedimientos" ? "Se quitará de las plantillas. " : ""}Los documentos ya creados conservan su copia del texto.` : ""}`)) return false;
    if (t === "checklists") Object.keys(S.bib.checklists).forEach(k => S.bib.checklists[k] = S.bib.checklists[k].filter(x => x.id !== id));
    else { const lista = catDef(t).lista(), i = lista.findIndex(x => x.id === id); if (i >= 0) lista.splice(i, 1); }
    if (t === "clausulas" || t === "procedimientos") S.bib.plantillas.forEach(pl => (pl.secciones || []).forEach(s => ["clausulas", "procedimientos"].forEach(k => { if (s[k]) s[k] = s[k].filter(x => x !== id); })));
    toast("Eliminado: " + id);
  },
  "bib-mv": el => { const l = S.bib.checklists[el.dataset.lista], i = l.findIndex(x => x.id === el.dataset.id), j = i + Number(el.dataset.d); if (j < 0 || j >= l.length) return false; [l[i], l[j]] = [l[j], l[i]]; }
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && S.modal) { S.modal = null; render(); } });

cargar();
